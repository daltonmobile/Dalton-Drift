<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#06000f">
  <title>Dalton Drift</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>

  <!-- LOADING -->
  <div id="screen-loading" class="screen active">
    <div class="loading-inner">
      <div class="loading-logo">DALTON DRIFT</div>
      <div class="loading-bar-wrap"><div class="loading-bar" id="loadingBar"></div></div>
      <div class="loading-text" id="loadingText">Loading…</div>
    </div>
  </div>

  <!-- MAIN MENU -->
  <div id="screen-menu" class="screen">
    <div class="menu-layout">
      <div class="menu-top">
        <img id="menuLogoImg" class="menu-logo" alt="Dalton Drift">
        <img id="menuHeroImg" class="menu-hero" alt="">
      </div>
      <div class="menu-best" id="menuBest">BEST: 0 m</div>
      <div class="menu-cam-box">
        <div class="cam-box-title">SELECT CAMERA MODE</div>
        <div class="cam-box-row">
          <button class="cam-thumb active" data-cam="highway" onclick="UI.selectCam(this,'highway')">
            <img id="camHighwayThumb" class="cam-thumb-img" alt="Highway">
            <span>Highway</span>
          </button>
          <button class="cam-thumb" data-cam="topdown" onclick="UI.selectCam(this,'topdown')">
            <img id="camTopdownThumb" class="cam-thumb-img" alt="Top-Down">
            <span>Top-Down</span>
          </button>
          <button class="cam-thumb" data-cam="dashboard" onclick="UI.selectCam(this,'dashboard')">
            <img id="camDashThumb" class="cam-thumb-img cam-thumb-dash" alt="Dashboard">
            <span>Dashboard</span>
          </button>
        </div>
      </div>
      <button class="menu-play-btn" onclick="Game.start()">
        <img id="playBtnImg" class="play-btn-img" alt="PLAY">
      </button>
      <div class="menu-links">
        <button class="menu-link" onclick="UI.showScreen('screen-achievements')">Achievements</button>
        <button class="menu-link" onclick="UI.showScreen('screen-settings')">Settings</button>
      </div>
    </div>
  </div>

  <!-- ACHIEVEMENTS -->
  <div id="screen-achievements" class="screen sub-screen">
    <div class="screen-header">
      <button class="back-btn" onclick="UI.showScreen('screen-menu')">← BACK</button>
      <h2>ACHIEVEMENTS</h2>
    </div>
    <div class="achievement-list" id="achievementList"></div>
  </div>

  <!-- SETTINGS -->
  <div id="screen-settings" class="screen sub-screen">
    <div class="screen-header">
      <button class="back-btn" onclick="UI.showScreen('screen-menu')">← BACK</button>
      <h2>SETTINGS</h2>
    </div>
    <div class="settings-list">
      <div class="setting-row"><span>Sound</span><button class="toggle-btn" id="toggleSound" onclick="UI.toggleSetting('sound')">ON</button></div>
      <div class="setting-row"><span>Vibration</span><button class="toggle-btn" id="toggleVibration" onclick="UI.toggleSetting('vibration')">ON</button></div>
      <div class="setting-row"><span>Camera</span><button class="toggle-btn" id="toggleCamera" onclick="UI.toggleSetting('camera')">HIGHWAY</button></div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-stat">
        <div class="hud-val" id="hudDist">0<span class="hud-unit">m</span></div>
        <div class="hud-label">DISTANCE</div>
      </div>
      <div class="hud-stat center">
        <div class="hud-val cyan" id="hudScore">0</div>
        <div class="hud-label">SCORE</div>
      </div>
      <button class="hud-pause-btn" id="pauseBtn">⏸</button>
    </div>
    <div class="hud-nitro-wrap">
      <img id="hudNitroImg" class="hud-nitro-img" alt="NITRO">
      <div class="hud-nitro-bar"><div class="hud-nitro-fill" id="nitroFill"></div></div>
    </div>
    <div class="hud-speed-box">
      <div class="hud-speed-val" id="hudSpeed">0</div>
      <div class="hud-speed-unit">km/h</div>
    </div>
    <div class="near-miss-popup" id="nearMissPopup">NEAR MISS <span>+50</span></div>
    <div id="flash-overlay"></div>
  </div>

  <!-- PAUSE -->
  <div id="overlay-pause" class="overlay hidden">
    <div class="overlay-box">
      <div class="overlay-title">PAUSED</div>
      <button class="btn-overlay" id="resumeBtn">RESUME</button>
      <button class="btn-overlay secondary" id="quitBtn">QUIT</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="overlay-gameover" class="overlay hidden">
    <div class="overlay-box">
      <div class="overlay-title red">GAME OVER</div>
      <div class="overlay-stat"><span>Distance</span><span id="goDistance">0 m</span></div>
      <div class="overlay-stat"><span>Score</span><span id="goScore">0</span></div>
      <div class="overlay-stat gold"><span>Best</span><span id="goBest">0 m</span></div>
      <button class="btn-overlay" id="playAgainBtn">PLAY AGAIN</button>
      <button class="btn-overlay secondary" id="mainMenuBtn">MAIN MENU</button>
    </div>
  </div>

  <div id="touch-left"  class="touch-zone"></div>
  <div id="touch-right" class="touch-zone"></div>
</div>

<script src="js/assets.js"></script>
<script src="js/utils.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/road.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/traffic.js"></script>
<script src="js/player.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/achievements.js"></script>
<script src="js/main.js"></script>
</body>
</html>
