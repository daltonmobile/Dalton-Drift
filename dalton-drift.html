    document.getElementById('goBest').textContent     = Math.round(best) + ' m';

    // Vibration
    if (settings.vibration && navigator.vibrate) navigator.vibrate([80, 40, 200]);
  }

  // ── Main loop ──────────────────────────────
  function startLoop() {
    function loop(ts) {
      raf = requestAnimationFrame(loop);
      const dt = Math.min(ts - lastTime, 50);
      lastTime = ts;
      tick(dt);
      render();
    }
    requestAnimationFrame(loop);
  }

  // ── Update ─────────────────────────────────
  function tick(dt) {
    if (state !== 'playing') return;

    frameCount++;

    // Speed ramp (soft exponential)
    const targetSpeed = Math.min(MAX_SPEED, baseSpeed + frameCount * 0.0028);
    speed = Utils.lerp(speed, targetSpeed, 0.02);

    // Distance
    distance += speed * 0.22;
    score    += Math.round(speed * 0.8);

    // Road scroll
    Road.update(speed);

    // Keyboard steering
    Player.setSteer(
      keys['ArrowLeft']  || keys['KeyA'],
      keys['ArrowRight'] || keys['KeyD']
    );
    Player.update(W, H, camMode, speed);

    // Traffic
    Traffic.update(speed, frameCount, Road.getLaneCount());

    // Collision
    if (!Player.isInvincible()) {
      const hit = Traffic.checkCollision(
        Player.getX(), Player.getY(), Player.getW(), Player.getH(),
        camMode, H
      );
      if (hit) {
        Player.spawnCollisionSparks();
        Player.makeInvincible(110);
        Traffic.removeVehicle(hit);
        cameraShake = 18;
        if (settings.vibration && navigator.vibrate) navigator.vibrate([60, 20, 120]);
        endGame();
        return;
      }

      // Near miss
      const nm = Traffic.checkNearMiss(
        Player.getX(), Player.getY(), Player.getW(), Player.getH(),
        camMode, H
      );
      if (nm && nearMissTimer > 45) {
        nearMissTimer = 0;
        nearMissCount++;
        score += 50;
        Player.spawnNearMissSparks();
        Audio.playNearMiss();
        UI.showNearMiss();
        Achievements.onNearMiss();
        if (settings.vibration && navigator.vibrate) navigator.vibrate(30);
      }
    }

    if (nearMissTimer < 999) nearMissTimer++;

    // Camera shake decay
    if (cameraShake > 0) cameraShake *= shakeDecay;
    if (cameraShake < 0.5) cameraShake = 0;

    // Audio engine sound
    Audio.updateEngine(speed / MAX_SPEED, false);

    // HUD
    UI.updateHUD(Math.round(distance), score, Math.round(speed * 6));
  }

  // ── Render ─────────────────────────────────
  function render() {
    ctx.clearRect(0, 0, W, H);

    if (state === 'menu') {
      // Animated background on menu
      Road.update(1.2);
      if (camMode === 'topdown') Road.drawTopDown(ctx, W, H, 1.2);
      else                        Road.drawHighway(ctx, W, H, 1.2);
      // dim overlay
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      return;
    }

    if (state === 'playing' || state === 'paused' || state === 'gameover') {
      // Camera shake
      if (cameraShake > 0.5) {
        ctx.save();
        ctx.translate(
          (Math.random() - 0.5) * cameraShake * 2,
          (Math.random() - 0.5) * cameraShake * 1.2
        );
      }

      // Road
      if (camMode === 'topdown') {
        Road.drawTopDown(ctx, W, H, speed);
        Traffic.drawTopDown(ctx, H);
        Player.draw(ctx, camMode);
      } else {
        Road.drawHighway(ctx, W, H, speed);
        Traffic.drawHighway(ctx);
        Player.draw(ctx, camMode);
      }

      // Speed lines at high speed
      if (speed > 10) {
        const alpha = Utils.clamp((speed - 10) / 8, 0, 0.22);
        drawSpeedLines(alpha);
      }

      // Vignette
      drawVignette();

      if (cameraShake > 0.5) ctx.restore();
    }
  }

  function drawSpeedLines(alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const cx = W / 2, cy = H * 0.5;
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const len = 80 + Math.random() * 120;
      const r0 = W * 0.22;
      ctx.strokeStyle = 'rgba(180,160,255,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len));
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawVignette() {
    const vg = ctx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.82);
    vg.addColorStop(0, 'transparent');
    vg.addColorStop(1, 'rgba(0,0,0,0.48)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // Public API
  function setCamMode(mode) { camMode = mode; settings.camera = mode; saveSettings(); }
  function getCamMode()     { return camMode; }
  function getSettings()    { return settings; }
  function setSetting(key, val) { settings[key] = val; saveSettings(); }

  return { init, start, togglePause, quit, setCamMode, getCamMode, getSettings, setSetting };
})();


// ── js/ui.js ──
// ═══════════════════════════════════════════
// ui.js — Screen transitions + HUD updates
// ═══════════════════════════════════════════

const UI = (() => {

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    if (id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('active');
    }
  }

  function showOverlay(id) {
    const el = document.getElementById(id);
    if (el) el.classList.remove('hidden');
  }

  function hideOverlay(id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('hidden');
  }

  function showHUD(visible) {
    const hud = document.getElementById('hud');
    if (visible) hud.classList.remove('hidden');
    else         hud.classList.add('hidden');
  }

  function updateHUD(dist, score, speed) {
    document.getElementById('hudDist').innerHTML  = dist + '<span>m</span>';
    document.getElementById('hudScore').textContent = score.toLocaleString();
    document.getElementById('hudSpeed').textContent = speed;
  }

  let nearMissTO = null;
  function showNearMiss() {
    const el = document.getElementById('nearMissPopup');
    el.classList.add('show');
    clearTimeout(nearMissTO);
    nearMissTO = setTimeout(() => el.classList.remove('show'), 1100);
  }

  function updateMenuBest() {
    const best = localStorage.getItem('dd_best') || '0';
    document.getElementById('menuBest').textContent = 'Best: ' + Math.round(best) + ' m';
  }

  function selectCam(el, mode) {
    document.querySelectorAll('.cam-option').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    Game.setCamMode(mode);
  }

  function toggleSetting(key) {
    const s = Game.getSettings();
    if (key === 'sound') {
      s.sound = !s.sound;
      Audio.setEnabled(s.sound);
      Game.setSetting('sound', s.sound);
      document.getElementById('toggleSound').textContent = s.sound ? 'ON' : 'OFF';
      document.getElementById('toggleSound').classList.toggle('off', !s.sound);
    } else if (key === 'vibration') {
      s.vibration = !s.vibration;
      Game.setSetting('vibration', s.vibration);
      document.getElementById('toggleVibration').textContent = s.vibration ? 'ON' : 'OFF';
      document.getElementById('toggleVibration').classList.toggle('off', !s.vibration);
    } else if (key === 'camera') {
      const mode = Game.getCamMode() === 'highway' ? 'topdown' : 'highway';
      Game.setCamMode(mode);
      document.getElementById('toggleCamera').textContent = mode === 'highway' ? 'HIGHWAY' : 'TOP-DOWN';
    }
  }

  function syncSettingsUI() {
    const s = Game.getSettings();
    document.getElementById('toggleSound').textContent     = s.sound     ? 'ON' : 'OFF';
    document.getElementById('toggleVibration').textContent = s.vibration ? 'ON' : 'OFF';
    document.getElementById('toggleCamera').textContent    = (s.camera || 'highway') === 'highway' ? 'HIGHWAY' : 'TOP-DOWN';
    document.getElementById('toggleSound').classList.toggle('off',     !s.sound);
    document.getElementById('toggleVibration').classList.toggle('off', !s.vibration);
  }

  return { showScreen, showOverlay, hideOverlay, showHUD, updateHUD, showNearMiss, updateMenuBest, selectCam, toggleSetting, syncSettingsUI };
})();


// ── js/achievements.js ──
// ═══════════════════════════════════════════
// achievements.js
// ═══════════════════════════════════════════

const Achievements = (() => {

  const DEFS = [
    { id: 'first_run',   icon: '🏁', name: 'First Run',      desc: 'Complete your first run',          check: (d) => d >= 1 },
    { id: 'dist_500',    icon: '📍', name: 'Street Racer',   desc: 'Survive 500m',                     check: (d) => d >= 500 },
    { id: 'dist_1000',   icon: '🛣️', name: 'Highway Star',   desc: 'Survive 1000m',                    check: (d) => d >= 1000 },
    { id: 'dist_2500',   icon: '🌆', name: 'Night Drifter',  desc: 'Survive 2500m',                    check: (d) => d >= 2500 },
    { id: 'dist_5000',   icon: '🏆', name: 'Drift Legend',   desc: 'Survive 5000m',                    check: (d) => d >= 5000 },
    { id: 'near_miss_3', icon: '💨', name: 'Living Dangerously', desc: '3 near misses in one run',     check: (d, nm) => nm >= 3 },
    { id: 'near_miss_10',icon: '⚡', name: 'Ghost Driver',   desc: '10 near misses in one run',        check: (d, nm) => nm >= 10 },
    { id: 'score_5k',    icon: '💰', name: 'Big Scorer',     desc: 'Score 5000 points',                check: (d, nm, s) => s >= 5000 },
    { id: 'score_20k',   icon: '💎', name: 'Perfectionist',  desc: 'Score 20,000 points',              check: (d, nm, s) => s >= 20000 },
  ];

  let unlocked = {};
  let nearMissSession = 0;

  function load() {
    try { unlocked = JSON.parse(localStorage.getItem('dd_ach') || '{}'); } catch(e) { unlocked = {}; }
  }

  function save() {
    localStorage.setItem('dd_ach', JSON.stringify(unlocked));
  }

  function check(dist, nearMisses, score) {
    DEFS.forEach(a => {
      if (!unlocked[a.id] && a.check(dist, nearMisses, score)) {
        unlocked[a.id] = Date.now();
      }
    });
    save();
    renderList();
  }

  function onNearMiss() {
    nearMissSession++;
    check(0, nearMissSession, 0);
  }

  function sessionReset() { nearMissSession = 0; }

  function renderList() {
    const el = document.getElementById('achievementList');
    if (!el) return;
    el.innerHTML = '';
    DEFS.forEach(a => {
      const isUnlocked = !!unlocked[a.id];
      const div = document.createElement('div');
      div.className = 'achievement-item' + (isUnlocked ? ' unlocked' : '');
      div.innerHTML = `
        <div class="achievement-icon">${a.icon}</div>
        <div class="achievement-info">
          <div class="achievement-name">${a.name}</div>
          <div class="achievement-desc">${a.desc}</div>
        </div>
        <div class="achievement-badge">${isUnlocked ? '✅' : '🔒'}</div>
      `;
      el.appendChild(div);
    });
  }

  return { load, check, onNearMiss, sessionReset, renderList };
})();


// ── js/main.js ──
// ═══════════════════════════════════════════
// main.js — Bootstrap
// ═══════════════════════════════════════════

window.addEventListener('DOMContentLoaded', () => {
  // Add flash overlay for collisions
  const flash = document.createElement('div');
  flash.id = 'flash-overlay';
  document.getElementById('app').appendChild(flash);

  // Load persistent data
  Achievements.load();
  Achievements.renderList();

  // Init game engine
  Game.init();

  // Sync settings UI to stored prefs
  UI.syncSettingsUI();

  // Sync cam buttons to stored cam mode
  const storedCam = Game.getCamMode();
  document.querySelectorAll('.cam-option').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cam === storedCam);
  });

  // Show menu
  UI.showScreen('screen-menu');
  UI.updateMenuBest();

  // PWA service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
});


</script>
