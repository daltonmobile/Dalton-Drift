<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#06000f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Dalton Drift</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
/* ═══════════════════════════════════════════
   DALTON DRIFT — CSS
   Synthwave Night Racing
═══════════════════════════════════════════ */

:root {
  --neon-cyan:    #00e5ff;
  --neon-magenta: #ff2d78;
  --neon-purple:  #9d4edd;
  --neon-gold:    #fbbf24;
  --road-dark:    #0a0a0e;
  --bg-deep:      #06000f;
  --bg-mid:       #0d0020;
  --text-primary: #ffffff;
  --text-dim:     rgba(255,255,255,0.5);
  --font-display: 'Orbitron', monospace;
  --font-body:    'Barlow Condensed', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg-deep);
  font-family: var(--font-body);
  color: var(--text-primary);
}

#app {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
}

#gameCanvas {
  display: block;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

/* ─── SCREENS ─────────────────────────────── */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
  z-index: 10;
}
.screen.active {
  opacity: 1;
  pointer-events: all;
}

/* ─── MENU ────────────────────────────────── */
#screen-menu {
  background: radial-gradient(ellipse 80% 70% at 50% 30%, #1a003a 0%, var(--bg-deep) 70%);
}

.menu-bg-glow {
  position: absolute;
  top: -10%; left: 50%;
  transform: translateX(-50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, rgba(157,78,221,0.25) 0%, transparent 65%);
  pointer-events: none;
}

.menu-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  z-index: 1;
  padding: 40px 24px;
  width: 100%;
  max-width: 420px;
}

.logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
  gap: 0;
}
.logo-dalton {
  font-family: var(--font-display);
  font-size: clamp(44px, 12vw, 72px);
  font-weight: 900;
  color: var(--neon-magenta);
  text-shadow: 0 0 20px var(--neon-magenta), 0 0 50px rgba(255,45,120,0.4);
  letter-spacing: 6px;
}
.logo-drift {
  font-family: var(--font-display);
  font-size: clamp(44px, 12vw, 72px);
  font-weight: 900;
  color: var(--neon-cyan);
  text-shadow: 0 0 20px var(--neon-cyan), 0 0 50px rgba(0,229,255,0.4);
  letter-spacing: 6px;
  margin-top: -6px;
}

.best-distance {
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 3px;
  color: rgba(157,78,221,0.8);
  text-transform: uppercase;
}

.menu-cam-selector {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.selector-label {
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--text-dim);
}
.selector-row {
  display: flex;
  gap: 12px;
}
.cam-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 12px 24px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(0,229,255,0.2);
  color: rgba(255,255,255,0.6);
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 2px;
  cursor: pointer;
  border-radius: 6px;
  transition: all 0.2s;
}
.cam-option .cam-icon { font-size: 22px; }
.cam-option:hover { border-color: rgba(0,229,255,0.5); color: #fff; }
.cam-option.active {
  background: rgba(0,229,255,0.1);
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  box-shadow: 0 0 20px rgba(0,229,255,0.2), inset 0 0 20px rgba(0,229,255,0.05);
}

.btn-play {
  position: relative;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}
.btn-play-inner {
  display: block;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 6px;
  color: #fff;
  background: linear-gradient(135deg, #7c3aed, var(--neon-magenta));
  padding: 18px 64px;
  clip-path: polygon(16px 0%, 100% 0%, calc(100% - 16px) 100%, 0% 100%);
  transition: all 0.2s;
  text-shadow: 0 0 10px rgba(255,255,255,0.4);
  box-shadow: 0 4px 30px rgba(219,39,119,0.5);
}
.btn-play:hover .btn-play-inner {
  transform: scale(1.04);
  box-shadow: 0 6px 40px rgba(219,39,119,0.7);
}
.btn-play:active .btn-play-inner { transform: scale(0.98); }

.menu-links {
  display: flex;
  gap: 32px;
}
.menu-link {
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 2px;
  cursor: pointer;
  text-transform: uppercase;
  transition: color 0.2s;
}
.menu-link:hover { color: var(--neon-cyan); }

/* ─── SUB SCREENS ─────────────────────────── */
.screen-header {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 24px;
  background: rgba(0,0,0,0.4);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.screen-header h2 {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--neon-cyan);
}
.back-btn {
  background: none; border: none;
  color: var(--text-dim);
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
  padding: 6px 12px;
  transition: color 0.2s;
}
.back-btn:hover { color: var(--neon-cyan); }

#screen-achievements, #screen-settings {
  background: var(--bg-deep);
  justify-content: flex-start;
  padding-top: 80px;
}

.achievement-list {
  width: 100%;
  max-width: 480px;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
  max-height: calc(100vh - 100px);
}
.achievement-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  transition: border-color 0.2s;
}
.achievement-item.unlocked {
  border-color: rgba(251,191,36,0.35);
  background: rgba(251,191,36,0.05);
}
.achievement-icon { font-size: 28px; }
.achievement-info { flex: 1; }
.achievement-name {
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 2px;
  color: #fff;
  margin-bottom: 3px;
}
.achievement-desc {
  font-size: 13px;
  color: var(--text-dim);
}
.achievement-badge {
  font-size: 20px;
  opacity: 0.3;
}
.achievement-item.unlocked .achievement-badge { opacity: 1; }

.settings-list {
  width: 100%;
  max-width: 480px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.toggle-btn {
  background: rgba(0,229,255,0.1);
  border: 1px solid rgba(0,229,255,0.3);
  color: var(--neon-cyan);
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 2px;
  padding: 8px 16px;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
  min-width: 80px;
}
.toggle-btn.off {
  background: rgba(255,255,255,0.04);
  border-color: rgba(255,255,255,0.1);
  color: var(--text-dim);
}
.toggle-btn:hover { opacity: 0.8; }

/* ─── HUD ─────────────────────────────────── */
#hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 20;
}
#hud.hidden { display: none; }

.hud-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 16px 20px 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
}

.hud-distance {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.hud-dist-val {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  line-height: 1;
}
.hud-dist-val span {
  font-size: 14px;
  font-weight: 400;
  color: var(--text-dim);
  margin-left: 2px;
}
.hud-dist-label {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-dim);
  margin-top: 2px;
}

.hud-score-center { text-align: center; }
.hud-score-val {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--neon-cyan);
  text-shadow: 0 0 12px var(--neon-cyan);
}
.hud-score-label {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-dim);
}

.hud-pause-btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.7);
  font-size: 18px;
  width: 40px; height: 40px;
  border-radius: 8px;
  cursor: pointer;
  pointer-events: all;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.hud-pause-btn:hover {
  background: rgba(255,255,255,0.15);
  color: #fff;
}

.hud-speed {
  position: absolute;
  bottom: 28px;
  right: 22px;
  text-align: right;
}
#hudSpeed {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 900;
  color: var(--neon-cyan);
  text-shadow: 0 0 16px var(--neon-cyan);
  line-height: 1;
}
.hud-speed-unit {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text-dim);
  display: block;
  text-align: right;
}

.near-miss-popup {
  position: absolute;
  top: 38%;
  left: 50%;
  transform: translateX(-50%) translateY(-10px);
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--neon-gold);
  text-shadow: 0 0 20px var(--neon-gold);
  opacity: 0;
  transition: opacity 0.15s, transform 0.15s;
  white-space: nowrap;
}
.near-miss-popup span { color: #fff; }
.near-miss-popup.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ─── OVERLAYS ────────────────────────────── */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 30;
}
.overlay.hidden { display: none; }

.overlay-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 40px 32px;
  width: min(380px, 88vw);
  background: rgba(13,0,32,0.95);
  border: 1px solid rgba(157,78,221,0.3);
  border-radius: 12px;
  box-shadow: 0 0 60px rgba(157,78,221,0.2);
}

.overlay-title {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 6px;
  color: var(--neon-cyan);
  text-shadow: 0 0 20px var(--neon-cyan);
  margin-bottom: 8px;
}
.gameover-title {
  color: var(--neon-magenta);
  text-shadow: 0 0 20px var(--neon-magenta);
}

.overlay-stat {
  display: flex;
  justify-content: space-between;
  width: 100%;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.7);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  padding-bottom: 10px;
}
.overlay-stat span:last-child {
  color: #fff;
  font-family: var(--font-display);
  font-size: 15px;
}
.best-line span:last-child {
  color: var(--neon-gold);
  text-shadow: 0 0 10px var(--neon-gold);
}

.btn-overlay {
  width: 100%;
  background: linear-gradient(135deg, #7c3aed, var(--neon-magenta));
  border: none;
  color: #fff;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 4px;
  padding: 15px 0;
  cursor: pointer;
  border-radius: 6px;
  transition: all 0.2s;
  margin-top: 4px;
  text-shadow: 0 0 8px rgba(255,255,255,0.3);
}
.btn-overlay:hover { opacity: 0.85; transform: scale(1.02); }
.btn-overlay:active { transform: scale(0.98); }
.btn-overlay.secondary {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.6);
  text-shadow: none;
}
.btn-overlay.secondary:hover { color: #fff; }

/* ─── TOUCH ZONES ─────────────────────────── */
.touch-zone {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  z-index: 15;
  pointer-events: none;
}
#touch-left { left: 0; }
#touch-right { right: 0; }

/* Active state visual hint (subtle) */
.touch-zone.pressing::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0; left: 0; right: 0;
  background: rgba(0,229,255,0.03);
}

/* ─── UTILITY ─────────────────────────────── */
.hidden { display: none !important; }

/* ─── SCREEN FLASH ────────────────────────── */
#flash-overlay {
  position: absolute;
  inset: 0;
  background: rgba(255, 45, 120, 0.15);
  pointer-events: none;
  opacity: 0;
  z-index: 25;
  transition: opacity 0.06s;
}
#flash-overlay.flash { opacity: 1; }


</style>
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>

    <!-- SCREENS -->
    <div id="screen-menu" class="screen active">
      <div class="menu-bg-glow"></div>
      <div class="menu-content">
        <div class="logo">
          <span class="logo-dalton">DALTON</span>
          <span class="logo-drift">DRIFT</span>
        </div>
        <div class="best-distance" id="menuBest">Best: 0 m</div>

        <div class="menu-cam-selector">
          <div class="selector-label">CAMERA MODE</div>
          <div class="selector-row">
            <button class="cam-option active" data-cam="highway" onclick="UI.selectCam(this,'highway')">
              <span class="cam-icon">🛣</span>
              <span>Highway</span>
            </button>
            <button class="cam-option" data-cam="topdown" onclick="UI.selectCam(this,'topdown')">
              <span class="cam-icon">🔭</span>
              <span>Top-Down</span>
            </button>
          </div>
        </div>

        <button class="btn-play" onclick="Game.start()">
          <span class="btn-play-inner">PLAY</span>
        </button>

        <div class="menu-links">
          <button class="menu-link" onclick="UI.showScreen('screen-achievements')">Achievements</button>
          <button class="menu-link" onclick="UI.showScreen('screen-settings')">Settings</button>
        </div>
      </div>
    </div>

    <div id="screen-achievements" class="screen">
      <div class="screen-header">
        <button class="back-btn" onclick="UI.showScreen('screen-menu')">← BACK</button>
        <h2>Achievements</h2>
      </div>
      <div class="achievement-list" id="achievementList"></div>
    </div>

    <div id="screen-settings" class="screen">
      <div class="screen-header">
        <button class="back-btn" onclick="UI.showScreen('screen-menu')">← BACK</button>
        <h2>Settings</h2>
      </div>
      <div class="settings-list">
        <div class="setting-row">
          <span>Sound</span>
          <button class="toggle-btn" id="toggleSound" onclick="UI.toggleSetting('sound')">ON</button>
        </div>
        <div class="setting-row">
          <span>Vibration</span>
          <button class="toggle-btn" id="toggleVibration" onclick="UI.toggleSetting('vibration')">ON</button>
        </div>
        <div class="setting-row">
          <span>Camera Mode</span>
          <button class="toggle-btn" id="toggleCamera" onclick="UI.toggleSetting('camera')">HIGHWAY</button>
        </div>
      </div>
    </div>

    <!-- HUD (visible during play) -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-distance">
          <div class="hud-dist-val" id="hudDist">0<span>m</span></div>
          <div class="hud-dist-label">DISTANCE</div>
        </div>
        <div class="hud-score-center">
          <div class="hud-score-val" id="hudScore">0</div>
          <div class="hud-score-label">SCORE</div>
        </div>
        <button class="hud-pause-btn" onclick="Game.togglePause()">⏸</button>
      </div>
      <div class="hud-speed">
        <span id="hudSpeed">0</span>
        <span class="hud-speed-unit">km/h</span>
      </div>
      <div class="near-miss-popup" id="nearMissPopup">NEAR MISS <span>+50</span></div>
    </div>

    <!-- PAUSE overlay -->
    <div id="overlay-pause" class="overlay hidden">
      <div class="overlay-box">
        <div class="overlay-title">PAUSED</div>
        <button class="btn-overlay" onclick="Game.togglePause()">RESUME</button>
        <button class="btn-overlay secondary" onclick="Game.quit()">QUIT</button>
      </div>
    </div>

    <!-- GAME OVER overlay -->
    <div id="overlay-gameover" class="overlay hidden">
      <div class="overlay-box">
        <div class="overlay-title gameover-title">GAME OVER</div>
        <div class="overlay-stat">
          <span>Distance</span><span id="goDistance">0 m</span>
        </div>
        <div class="overlay-stat">
          <span>Score</span><span id="goScore">0</span>
        </div>
        <div class="overlay-stat best-line">
          <span>Best</span><span id="goBest">0 m</span>
        </div>
        <button class="btn-overlay" onclick="Game.start()">PLAY AGAIN</button>
        <button class="btn-overlay secondary" onclick="Game.quit()">MAIN MENU</button>
      </div>
    </div>

    <!-- Touch zones -->
    <div id="touch-left" class="touch-zone"></div>
    <div id="touch-right" class="touch-zone"></div>
  </div>

  <!-- Scripts in load order -->
<script>

// ── js/utils.js ──
// ═══════════════════════════════════════════
// utils.js — Math helpers & shared constants
// ═══════════════════════════════════════════

const Utils = (() => {
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function randRange(min, max) { return min + Math.random() * (max - min); }
  function randInt(min, max) { return Math.floor(randRange(min, max + 1)); }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function easeIn(t) { return t * t * t; }

  // Deep colour helpers
  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return { r, g, b };
  }
  function rgba(hex, a) {
    const { r, g, b } = hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
  }
  function lighten(hex, amount) {
    const { r, g, b } = hexToRgb(hex);
    return `rgb(${clamp(r + amount, 0, 255)},${clamp(g + amount, 0, 255)},${clamp(b + amount, 0, 255)})`;
  }
  function darken(hex, amount) { return lighten(hex, -amount); }

  return { lerp, clamp, randRange, randInt, easeOut, easeIn, hexToRgb, rgba, lighten, darken };
})();


// ── js/sprites.js ──
// ═══════════════════════════════════════════
// sprites.js — Realistic vehicle renderers
//
// Each car type is drawn with:
//  - Accurate silhouette for the vehicle class
//  - Metallic body with gradient shading
//  - Proper window shapes (not just rectangles)
//  - Headlights / taillights with glow
//  - Wheels with tyre detail
//  - Soft shadow underneath
//  - Neon underglow for player car
//
// All functions draw centred at (0,0).
// Call ctx.translate(x,y) before drawing.
// ═══════════════════════════════════════════

const Sprites = (() => {

  // ── shared helpers ─────────────────────────

  function shadow(ctx, w, h, alpha = 0.45) {
    ctx.save();
    ctx.scale(1, 0.35);
    const g = ctx.createRadialGradient(0, h * 0.5 + 4, 0, 0, h * 0.5 + 4, w * 0.55);
    g.addColorStop(0, `rgba(0,0,0,${alpha})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, h * 0.5 + 4, w * 0.55, w * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function underglow(ctx, w, h, color) {
    const g = ctx.createRadialGradient(0, h * 0.3, 0, 0, h * 0.3, w * 0.7);
    g.addColorStop(0, color.replace(')', ',0.35)').replace('rgb', 'rgba'));
    g.addColorStop(0.6, color.replace(')', ',0.1)').replace('rgb', 'rgba'));
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, h * 0.3, w * 0.7, h * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function wheel(ctx, x, y, r, perspective = 1.0) {
    // Tyre (black rubber)
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * perspective, 0, 0, Math.PI * 2);
    ctx.fill();
    // Sidewall highlight
    ctx.strokeStyle = '#2a2a2a';
    ctx.lineWidth = r * 0.18;
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.78, r * 0.78 * perspective, 0, 0, Math.PI * 2);
    ctx.stroke();
    // Rim
    ctx.fillStyle = '#888';
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.52, r * 0.52 * perspective, 0, 0, Math.PI * 2);
    ctx.fill();
    // Rim spokes
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a) * r * 0.46, y + Math.sin(a) * r * 0.46 * perspective);
      ctx.stroke();
    }
    // Hub centre
    ctx.fillStyle = '#ccc';
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.12, r * 0.12 * perspective, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function headlight(ctx, x, y, w, h, color = '#fff8d0') {
    ctx.fillStyle = color;
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#ffd060';
    ctx.beginPath();
    ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Lens inner
    ctx.fillStyle = 'rgba(255,255,230,0.5)';
    ctx.beginPath();
    ctx.ellipse(x, y, w * 0.55, h * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function taillight(ctx, x, y, w, h, lit = true) {
    const bright = lit ? 1 : 0.35;
    ctx.fillStyle = `rgba(220,0,0,${bright})`;
    ctx.shadowBlur = lit ? 12 : 0;
    ctx.shadowColor = '#ff0000';
    ctx.beginPath();
    ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    if (lit) {
      ctx.fillStyle = 'rgba(255,80,80,0.5)';
      ctx.beginPath();
      ctx.ellipse(x, y, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function glassPanel(ctx, path, isWindshield = false) {
    ctx.fillStyle = isWindshield
      ? 'rgba(140,200,240,0.28)'
      : 'rgba(80,140,180,0.20)';
    ctx.fill(path);
    // Highlight streak
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 0.8;
    ctx.stroke(path);
  }

  // ── SPORTS COUPE (player + traffic) ────────
  // w=52, h=100 canonical size
  function drawSportsCoupe(ctx, w, h, bodyHex, isPlayer = false, driftAngle = 0, braking = false) {
    const hw = w / 2, hh = h / 2;

    ctx.save();
    if (driftAngle !== 0) ctx.rotate(driftAngle);

    shadow(ctx, w, h);
    if (isPlayer) underglow(ctx, w, h, '#9d4edd');

    // ── Body outer silhouette ──────────────────
    // Sports coupe: low hood, pronounced roof arch, short tail
    const body = new Path2D();
    body.moveTo(-hw + 8, -hh + 2);          // front-left corner
    body.quadraticCurveTo(-hw, -hh + 2, -hw, -hh + 12);  // front fascia curve
    body.lineTo(-hw, -hh + 30);             // front wing
    body.quadraticCurveTo(-hw - 2, -hh + 42, -hw, -hh + 52); // sill step
    body.lineTo(-hw, hh - 18);              // rear door sill
    body.quadraticCurveTo(-hw, hh - 8, -hw + 6, hh - 2); // rear quarter
    body.lineTo(-hw + 14, hh);             // rear bumper start
    body.lineTo(hw - 14, hh);              // rear bumper end
    body.quadraticCurveTo(hw - 6, hh, hw, hh - 2);
    body.lineTo(hw, hh - 18);
    body.quadraticCurveTo(hw + 2, hh - 8, hw, -hh + 52);
    body.lineTo(hw, -hh + 30);
    body.quadraticCurveTo(hw + 2, -hh + 42, hw, -hh + 12);
    body.quadraticCurveTo(hw, -hh + 2, hw - 8, -hh + 2);
    body.lineTo(hw - 22, -hh);             // bonnet front-right
    body.quadraticCurveTo(0, -hh - 2, -hw + 22, -hh); // bonnet nose curve
    body.closePath();

    // Body gradient — metallic paint
    const bg = ctx.createLinearGradient(-hw, -hh, hw, hh);
    const { r, g, b } = Utils.hexToRgb(bodyHex);
    bg.addColorStop(0,   `rgb(${Math.min(r+60,255)},${Math.min(g+60,255)},${Math.min(b+60,255)})`);
    bg.addColorStop(0.25,`rgb(${r},${g},${b})`);
    bg.addColorStop(0.55,`rgb(${Math.max(r-30,0)},${Math.max(g-30,0)},${Math.max(b-30,0)})`);
    bg.addColorStop(0.8, `rgb(${Math.min(r+20,255)},${Math.min(g+20,255)},${Math.min(b+20,255)})`);
    bg.addColorStop(1,   `rgb(${Math.max(r-50,0)},${Math.max(g-50,0)},${Math.max(b-50,0)})`);
    ctx.fillStyle = bg;
    ctx.fill(body);

    // Body edge
    ctx.strokeStyle = `rgba(${Math.min(r+80,255)},${Math.min(g+80,255)},${Math.min(b+80,255)},0.6)`;
    ctx.lineWidth = 0.8;
    ctx.stroke(body);

    // ── Roof ──────────────────────────────────
    const roof = new Path2D();
    roof.moveTo(-hw + 14, -hh + 30);       // A-pillar base L
    roof.quadraticCurveTo(-hw + 12, -hh + 18, -hw + 18, -hh + 12); // A-pillar
    roof.lineTo(-hw + 24, -hh + 8);        // roof front-left
    roof.quadraticCurveTo(0, -hh + 2, hw - 24, -hh + 8); // roof front arc
    roof.lineTo(hw - 18, -hh + 12);
    roof.quadraticCurveTo(hw - 12, -hh + 18, hw - 14, -hh + 30); // A-pillar R
    roof.lineTo(hw - 14, hh - 52);         // C-pillar base R
    roof.quadraticCurveTo(hw - 10, hh - 42, hw - 18, hh - 36); // C-pillar
    roof.lineTo(hw - 28, hh - 32);
    roof.quadraticCurveTo(0, hh - 28, -hw + 28, hh - 32);
    roof.lineTo(-hw + 18, hh - 36);
    roof.quadraticCurveTo(-hw + 10, hh - 42, -hw + 14, hh - 52);
    roof.closePath();

    const rg = ctx.createLinearGradient(0, -hh, 0, -hh + 60);
    rg.addColorStop(0, '#1a0030');
    rg.addColorStop(1, '#0a0014');
    ctx.fillStyle = rg;
    ctx.fill(roof);

    // ── Windshield ─────────────────────────────
    const ws = new Path2D();
    ws.moveTo(-hw + 16, -hh + 30);
    ws.quadraticCurveTo(-hw + 14, -hh + 20, -hw + 20, -hh + 14);
    ws.lineTo(-hw + 26, -hh + 10);
    ws.quadraticCurveTo(0, -hh + 5, hw - 26, -hh + 10);
    ws.lineTo(hw - 20, -hh + 14);
    ws.quadraticCurveTo(hw - 14, -hh + 20, hw - 16, -hh + 30);
    ws.lineTo(-hw + 16, -hh + 30);
    glassPanel(ctx, ws, true);

    // ── Rear window ────────────────────────────
    const rw = new Path2D();
    rw.moveTo(-hw + 17, hh - 34);
    rw.quadraticCurveTo(-hw + 13, hh - 40, -hw + 20, hh - 46);
    rw.lineTo(-hw + 30, hh - 50);
    rw.quadraticCurveTo(0, hh - 54, hw - 30, hh - 50);
    rw.lineTo(hw - 20, hh - 46);
    rw.quadraticCurveTo(hw - 13, hh - 40, hw - 17, hh - 34);
    rw.closePath();
    glassPanel(ctx, rw, false);

    // ── Door windows ───────────────────────────
    const dw1 = new Path2D();
    dw1.moveTo(-hw + 15, -hh + 32);
    dw1.lineTo(-hw + 14, hh - 54);
    dw1.lineTo(-hw + 24, hh - 54);
    dw1.quadraticCurveTo(-hw + 22, -hh + 35, -hw + 20, -hh + 30);
    dw1.closePath();
    glassPanel(ctx, dw1);

    const dw2 = new Path2D();
    dw2.moveTo(hw - 15, -hh + 32);
    dw2.lineTo(hw - 14, hh - 54);
    dw2.lineTo(hw - 24, hh - 54);
    dw2.quadraticCurveTo(hw - 22, -hh + 35, hw - 20, -hh + 30);
    dw2.closePath();
    glassPanel(ctx, dw2);

    // ── Panel lines / character lines ──────────
    ctx.strokeStyle = `rgba(${Math.max(r-40,0)},${Math.max(g-40,0)},${Math.max(b-40,0)},0.7)`;
    ctx.lineWidth = 0.7;
    // Door gap
    ctx.beginPath();
    ctx.moveTo(-hw + 14, -hh + 32);
    ctx.lineTo(-hw + 14, hh - 20);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hw - 14, -hh + 32);
    ctx.lineTo(hw - 14, hh - 20);
    ctx.stroke();
    // Bonnet crease
    ctx.beginPath();
    ctx.moveTo(-hw + 8, -hh + 4);
    ctx.quadraticCurveTo(-hw + 12, -hh + 8, -hw + 16, -hh + 18);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hw - 8, -hh + 4);
    ctx.quadraticCurveTo(hw - 12, -hh + 8, hw - 16, -hh + 18);
    ctx.stroke();

    // ── Front bumper / intake ──────────────────
    const bump = ctx.createLinearGradient(0, -hh, 0, -hh + 8);
    bump.addColorStop(0, '#111');
    bump.addColorStop(1, '#222');
    ctx.fillStyle = bump;
    ctx.beginPath();
    ctx.roundRect(-hw + 10, -hh, w - 20, 6, 2);
    ctx.fill();
    // Grille mesh
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < 5; i++) {
      const gx = -hw + 14 + i * (w - 28) / 4;
      ctx.beginPath();
      ctx.moveTo(gx, -hh + 1);
      ctx.lineTo(gx, -hh + 5);
      ctx.stroke();
    }

    // ── Headlights ─────────────────────────────
    headlight(ctx, -hw + 12, -hh + 7, 9, 4);
    headlight(ctx, hw - 12, -hh + 7, 9, 4);
    // DRL strip
    ctx.strokeStyle = 'rgba(255,230,130,0.6)';
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 6; ctx.shadowColor = '#ffd060';
    ctx.beginPath();
    ctx.moveTo(-hw + 20, -hh + 3);
    ctx.lineTo(-hw + 8, -hh + 3);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hw - 20, -hh + 3);
    ctx.lineTo(hw - 8, -hh + 3);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // ── Taillights ─────────────────────────────
    taillight(ctx, -hw + 11, hh - 6, 8, 4, true);
    taillight(ctx, hw - 11, hh - 6, 8, 4, braking);
    // LED strip
    ctx.strokeStyle = 'rgba(220,0,0,0.7)';
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 8; ctx.shadowColor = '#ff0000';
    ctx.beginPath();
    ctx.moveTo(-hw + 18, hh - 3);
    ctx.lineTo(-hw + 8, hh - 3);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hw - 18, hh - 3);
    ctx.lineTo(hw - 8, hh - 3);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // ── Wheels ─────────────────────────────────
    wheel(ctx, -hw + 9, -hh + 28, 10);
    wheel(ctx, hw - 9, -hh + 28, 10);
    wheel(ctx, -hw + 9, hh - 28, 10);
    wheel(ctx, hw - 9, hh - 28, 10);

    // ── Player neon trim ──────────────────────
    if (isPlayer) {
      ctx.strokeStyle = '#9d4edd';
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#9d4edd';
      ctx.stroke(body);
      ctx.shadowBlur = 0;
      // Side skirt neon
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 1.2;
      ctx.shadowBlur = 8; ctx.shadowColor = '#00e5ff';
      ctx.beginPath();
      ctx.moveTo(-hw + 2, 0);
      ctx.lineTo(-hw + 2, hh - 22);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(hw - 2, 0);
      ctx.lineTo(hw - 2, hh - 22);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  // ── SEDAN ───────────────────────────────────
  // w=48, h=92
  function drawSedan(ctx, w, h, bodyHex, braking = false) {
    const hw = w / 2, hh = h / 2;
    ctx.save();
    shadow(ctx, w, h);

    // Body — classic three-box silhouette
    const body = new Path2D();
    body.moveTo(-hw + 6, -hh + 2);
    body.quadraticCurveTo(-hw, -hh + 4, -hw, -hh + 14);
    body.lineTo(-hw, hh - 14);
    body.quadraticCurveTo(-hw, hh - 4, -hw + 6, hh);
    body.lineTo(hw - 6, hh);
    body.quadraticCurveTo(hw, hh - 4, hw, hh - 14);
    body.lineTo(hw, -hh + 14);
    body.quadraticCurveTo(hw, -hh + 4, hw - 6, -hh + 2);
    body.lineTo(hw - 18, -hh);
    body.quadraticCurveTo(0, -hh - 2, -hw + 18, -hh);
    body.closePath();

    const { r, g, b } = Utils.hexToRgb(bodyHex);
    const bg = ctx.createLinearGradient(-hw, -hh, hw * 0.6, hh);
    bg.addColorStop(0,   `rgb(${Math.min(r+50,255)},${Math.min(g+50,255)},${Math.min(b+50,255)})`);
    bg.addColorStop(0.4, `rgb(${r},${g},${b})`);
    bg.addColorStop(1,   `rgb(${Math.max(r-40,0)},${Math.max(g-40,0)},${Math.max(b-40,0)})`);
    ctx.fillStyle = bg;
    ctx.fill(body);
    ctx.strokeStyle = `rgba(${Math.min(r+60,255)},${Math.min(g+60,255)},${Math.min(b+60,255)},0.5)`;
    ctx.lineWidth = 0.7;
    ctx.stroke(body);

    // Roof (sedan-style: relatively upright sides)
    const roof = new Path2D();
    roof.moveTo(-hw + 12, -hh + 28);
    roof.quadraticCurveTo(-hw + 10, -hh + 16, -hw + 17, -hh + 10);
    roof.lineTo(-hw + 22, -hh + 8);
    roof.quadraticCurveTo(0, -hh + 4, hw - 22, -hh + 8);
    roof.lineTo(hw - 17, -hh + 10);
    roof.quadraticCurveTo(hw - 10, -hh + 16, hw - 12, -hh + 28);
    roof.lineTo(hw - 12, hh - 44);
    roof.quadraticCurveTo(hw - 10, hh - 36, hw - 16, hh - 30);
    roof.lineTo(hw - 24, hh - 28);
    roof.quadraticCurveTo(0, hh - 24, -hw + 24, hh - 28);
    roof.lineTo(-hw + 16, hh - 30);
    roof.quadraticCurveTo(-hw + 10, hh - 36, -hw + 12, hh - 44);
    roof.closePath();
    ctx.fillStyle = '#0e0e18';
    ctx.fill(roof);

    // Windshield
    const ws = new Path2D();
    ws.moveTo(-hw + 14, -hh + 28);
    ws.quadraticCurveTo(-hw + 12, -hh + 16, -hw + 18, -hh + 11);
    ws.lineTo(-hw + 24, -hh + 8);
    ws.quadraticCurveTo(0, -hh + 4, hw - 24, -hh + 8);
    ws.lineTo(hw - 18, -hh + 11);
    ws.quadraticCurveTo(hw - 12, -hh + 16, hw - 14, -hh + 28);
    ws.closePath();
    glassPanel(ctx, ws, true);

    const rwp = new Path2D();
    rwp.moveTo(-hw + 14, hh - 46);
    rwp.lineTo(-hw + 18, hh - 32);
    rwp.lineTo(hw - 18, hh - 32);
    rwp.lineTo(hw - 14, hh - 46);
    rwp.closePath();
    glassPanel(ctx, rwp);

    // Headlights
    headlight(ctx, -hw + 10, -hh + 8, 8, 4);
    headlight(ctx, hw - 10, -hh + 8, 8, 4);
    taillight(ctx, -hw + 10, hh - 6, 7, 3, true);
    taillight(ctx, hw - 10, hh - 6, 7, 3, braking);

    // Wheels
    wheel(ctx, -hw + 8, -hh + 24, 9);
    wheel(ctx, hw - 8, -hh + 24, 9);
    wheel(ctx, -hw + 8, hh - 24, 9);
    wheel(ctx, hw - 8, hh - 24, 9);

    ctx.restore();
  }

  // ── SUV ─────────────────────────────────────
  // w=54, h=96
  function drawSUV(ctx, w, h, bodyHex, braking = false) {
    const hw = w / 2, hh = h / 2;
    ctx.save();
    shadow(ctx, w, h, 0.5);

    const { r, g, b } = Utils.hexToRgb(bodyHex);

    // Body — tall, boxy with softened edges
    const body = new Path2D();
    body.moveTo(-hw + 5, -hh + 4);
    body.quadraticCurveTo(-hw, -hh + 4, -hw, -hh + 14);
    body.lineTo(-hw, hh - 14);
    body.quadraticCurveTo(-hw, hh - 2, -hw + 5, hh);
    body.lineTo(hw - 5, hh);
    body.quadraticCurveTo(hw, hh - 2, hw, hh - 14);
    body.lineTo(hw, -hh + 14);
    body.quadraticCurveTo(hw, -hh + 4, hw - 5, -hh + 4);
    body.lineTo(hw - 14, -hh);
    body.quadraticCurveTo(0, -hh - 1, -hw + 14, -hh);
    body.closePath();

    const bg = ctx.createLinearGradient(-hw, -hh, hw * 0.7, hh);
    bg.addColorStop(0,   `rgb(${Math.min(r+55,255)},${Math.min(g+55,255)},${Math.min(b+55,255)})`);
    bg.addColorStop(0.35,`rgb(${r},${g},${b})`);
    bg.addColorStop(0.7, `rgb(${Math.max(r-25,0)},${Math.max(g-25,0)},${Math.max(b-25,0)})`);
    bg.addColorStop(1,   `rgb(${Math.max(r-50,0)},${Math.max(g-50,0)},${Math.max(b-50,0)})`);
    ctx.fillStyle = bg;
    ctx.fill(body);
    ctx.strokeStyle = `rgba(${Math.min(r+70,255)},${Math.min(g+70,255)},${Math.min(b+70,255)},0.45)`;
    ctx.lineWidth = 0.8;
    ctx.stroke(body);

    // Roof (SUVs have very upright pillars)
    ctx.fillStyle = '#141420';
    ctx.beginPath();
    ctx.roundRect(-hw + 10, -hh + 14, w - 20, h * 0.56, 4);
    ctx.fill();

    // Windshield — near-vertical
    const ws = new Path2D();
    ws.moveTo(-hw + 12, -hh + 28);
    ws.lineTo(-hw + 14, -hh + 15);
    ws.lineTo(-hw + 18, -hh + 10);
    ws.quadraticCurveTo(0, -hh + 6, hw - 18, -hh + 10);
    ws.lineTo(hw - 14, -hh + 15);
    ws.lineTo(hw - 12, -hh + 28);
    ws.closePath();
    glassPanel(ctx, ws, true);

    // Side windows
    const sw1 = new Path2D();
    sw1.moveTo(-hw + 11, -hh + 30);
    sw1.lineTo(-hw + 10, hh - 46);
    sw1.lineTo(-hw + 20, hh - 46);
    sw1.lineTo(-hw + 21, -hh + 30);
    sw1.closePath();
    glassPanel(ctx, sw1);

    const sw2 = new Path2D();
    sw2.moveTo(hw - 11, -hh + 30);
    sw2.lineTo(hw - 10, hh - 46);
    sw2.lineTo(hw - 20, hh - 46);
    sw2.lineTo(hw - 21, -hh + 30);
    sw2.closePath();
    glassPanel(ctx, sw2);

    // Rear window
    const rw = new Path2D();
    rw.moveTo(-hw + 12, hh - 44);
    rw.lineTo(-hw + 14, hh - 30);
    rw.lineTo(hw - 14, hh - 30);
    rw.lineTo(hw - 12, hh - 44);
    rw.closePath();
    glassPanel(ctx, rw);

    // Roof rails
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-hw + 14, -hh + 10);
    ctx.lineTo(-hw + 14, hh - 44);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hw - 14, -hh + 10);
    ctx.lineTo(hw - 14, hh - 44);
    ctx.stroke();

    // Cladding strip (dark lower body)
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.roundRect(-hw + 2, hh - 22, w - 4, 14, 2);
    ctx.fill();

    headlight(ctx, -hw + 11, -hh + 9, 9, 5);
    headlight(ctx, hw - 11, -hh + 9, 9, 5);
    taillight(ctx, -hw + 11, hh - 7, 8, 4, true);
    taillight(ctx, hw - 11, hh - 7, 8, 4, braking);

    wheel(ctx, -hw + 10, -hh + 26, 12);
    wheel(ctx, hw - 10, -hh + 26, 12);
    wheel(ctx, -hw + 10, hh - 26, 12);
    wheel(ctx, hw - 10, hh - 26, 12);

    ctx.restore();
  }

  // ── HATCHBACK ───────────────────────────────
  // w=44, h=82
  function drawHatchback(ctx, w, h, bodyHex, braking = false) {
    const hw = w / 2, hh = h / 2;
    ctx.save();
    shadow(ctx, w, h);

    const { r, g, b } = Utils.hexToRgb(bodyHex);

    // Body — compact, tallish relative to length
    const body = new Path2D();
    body.moveTo(-hw + 5, -hh + 2);
    body.quadraticCurveTo(-hw, -hh + 4, -hw, -hh + 12);
    body.lineTo(-hw, hh - 12);
    body.quadraticCurveTo(-hw, hh - 2, -hw + 5, hh);
    body.lineTo(hw - 5, hh);
    body.quadraticCurveTo(hw, hh - 2, hw, hh - 12);
    body.lineTo(hw, -hh + 12);
    body.quadraticCurveTo(hw, -hh + 4, hw - 5, -hh + 2);
    body.lineTo(hw - 14, -hh);
    body.quadraticCurveTo(0, -hh - 1, -hw + 14, -hh);
    body.closePath();

    const bg = ctx.createLinearGradient(-hw, -hh, hw * 0.5, hh);
    bg.addColorStop(0,   `rgb(${Math.min(r+60,255)},${Math.min(g+60,255)},${Math.min(b+60,255)})`);
    bg.addColorStop(0.4, `rgb(${r},${g},${b})`);
    bg.addColorStop(1,   `rgb(${Math.max(r-45,0)},${Math.max(g-45,0)},${Math.max(b-45,0)})`);
    ctx.fillStyle = bg;
    ctx.fill(body);
    ctx.strokeStyle = `rgba(${Math.min(r+60,255)},${Math.min(g+60,255)},${Math.min(b+60,255)},0.5)`;
    ctx.lineWidth = 0.7;
    ctx.stroke(body);

    // Hatchback has a more integrated roof-to-rear angle
    const roof = new Path2D();
    roof.moveTo(-hw + 10, -hh + 26);
    roof.quadraticCurveTo(-hw + 8, -hh + 14, -hw + 15, -hh + 8);
    roof.quadraticCurveTo(0, -hh + 3, hw - 15, -hh + 8);
    roof.quadraticCurveTo(hw - 8, -hh + 14, hw - 10, -hh + 26);
    // Sloped hatch rear
    roof.lineTo(hw - 10, hh - 36);
    roof.lineTo(hw - 14, hh - 28);
    roof.quadraticCurveTo(0, hh - 24, -hw + 14, hh - 28);
    roof.lineTo(-hw + 10, hh - 36);
    roof.closePath();
    ctx.fillStyle = '#100012';
    ctx.fill(roof);

    // Windshield
    const ws = new Path2D();
    ws.moveTo(-hw + 12, -hh + 26);
    ws.quadraticCurveTo(-hw + 10, -hh + 14, -hw + 16, -hh + 9);
    ws.quadraticCurveTo(0, -hh + 4, hw - 16, -hh + 9);
    ws.quadraticCurveTo(hw - 10, -hh + 14, hw - 12, -hh + 26);
    ws.closePath();
    glassPanel(ctx, ws, true);

    // Rear hatch window (large)
    const rwp = new Path2D();
    rwp.moveTo(-hw + 12, hh - 38);
    rwp.lineTo(-hw + 16, hh - 28);
    rwp.lineTo(hw - 16, hh - 28);
    rwp.lineTo(hw - 12, hh - 38);
    rwp.closePath();
    glassPanel(ctx, rwp);

    headlight(ctx, -hw + 9, -hh + 7, 7, 4);
    headlight(ctx, hw - 9, -hh + 7, 7, 4);
    taillight(ctx, -hw + 9, hh - 6, 7, 3, true);
    taillight(ctx, hw - 9, hh - 6, 7, 3, braking);

    wheel(ctx, -hw + 8, -hh + 22, 9);
    wheel(ctx, hw - 8, -hh + 22, 9);
    wheel(ctx, -hw + 8, hh - 22, 9);
    wheel(ctx, hw - 8, hh - 22, 9);

    ctx.restore();
  }

  // ── PICKUP TRUCK ────────────────────────────
  // w=52, h=104
  function drawPickup(ctx, w, h, bodyHex, braking = false) {
    const hw = w / 2, hh = h / 2;
    ctx.save();
    shadow(ctx, w, h, 0.5);

    const { r, g, b } = Utils.hexToRgb(bodyHex);

    // Bed (rear)
    ctx.fillStyle = `rgb(${Math.max(r-50,0)},${Math.max(g-50,0)},${Math.max(b-50,0)})`;
    ctx.beginPath();
    ctx.roundRect(-hw + 3, hh - 48, w - 6, 44, [2, 2, 4, 4]);
    ctx.fill();
    // Bed interior
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.roundRect(-hw + 6, hh - 46, w - 12, 38, 2);
    ctx.fill();
    // Tailgate
    ctx.fillStyle = `rgb(${Math.max(r-20,0)},${Math.max(g-20,0)},${Math.max(b-20,0)})`;
    ctx.beginPath();
    ctx.roundRect(-hw + 3, hh - 10, w - 6, 6, 2);
    ctx.fill();

    // Cab
    const cab = new Path2D();
    cab.moveTo(-hw + 4, -hh + 2);
    cab.quadraticCurveTo(-hw, -hh + 4, -hw, -hh + 14);
    cab.lineTo(-hw, hh - 50);
    cab.quadraticCurveTo(-hw, hh - 42, -hw + 4, hh - 40);
    cab.lineTo(hw - 4, hh - 40);
    cab.quadraticCurveTo(hw, hh - 42, hw, hh - 50);
    cab.lineTo(hw, -hh + 14);
    cab.quadraticCurveTo(hw, -hh + 4, hw - 4, -hh + 2);
    cab.lineTo(hw - 16, -hh);
    cab.quadraticCurveTo(0, -hh - 1, -hw + 16, -hh);
    cab.closePath();

    const bg = ctx.createLinearGradient(-hw, -hh, hw * 0.7, hh - 40);
    bg.addColorStop(0,   `rgb(${Math.min(r+55,255)},${Math.min(g+55,255)},${Math.min(b+55,255)})`);
    bg.addColorStop(0.4, `rgb(${r},${g},${b})`);
    bg.addColorStop(1,   `rgb(${Math.max(r-35,0)},${Math.max(g-35,0)},${Math.max(b-35,0)})`);
    ctx.fillStyle = bg;
    ctx.fill(cab);
    ctx.strokeStyle = `rgba(${Math.min(r+60,255)},${Math.min(g+60,255)},${Math.min(b+60,255)},0.4)`;
    ctx.lineWidth = 0.8;
    ctx.stroke(cab);

    // Cab roof
    ctx.fillStyle = '#141420';
    ctx.beginPath();
    ctx.roundRect(-hw + 10, -hh + 12, w - 20, hh - 2, 5);
    ctx.fill();

    // Windshield
    const ws = new Path2D();
    ws.moveTo(-hw + 12, hh - 54);
    ws.lineTo(-hw + 14, -hh + 13);
    ws.lineTo(-hw + 18, -hh + 8);
    ws.quadraticCurveTo(0, -hh + 4, hw - 18, -hh + 8);
    ws.lineTo(hw - 14, -hh + 13);
    ws.lineTo(hw - 12, hh - 54);
    ws.closePath();
    glassPanel(ctx, ws, true);

    // Side window
    const sw = new Path2D();
    sw.moveTo(-hw + 11, hh - 56);
    sw.lineTo(-hw + 11, -hh + 13);
    sw.lineTo(-hw + 20, -hh + 13);
    sw.lineTo(-hw + 20, hh - 56);
    sw.closePath();
    glassPanel(ctx, sw);

    headlight(ctx, -hw + 10, -hh + 8, 9, 4);
    headlight(ctx, hw - 10, -hh + 8, 9, 4);
    taillight(ctx, -hw + 10, hh - 6, 8, 3, true);
    taillight(ctx, hw - 10, hh - 6, 8, 3, braking);

    // Big truck wheels
    wheel(ctx, -hw + 10, -hh + 28, 12);
    wheel(ctx, hw - 10, -hh + 28, 12);
    wheel(ctx, -hw + 10, hh - 28, 12);
    wheel(ctx, hw - 10, hh - 28, 12);

    ctx.restore();
  }

  // ── SEMI TRUCK ──────────────────────────────
  // w=60, h=140
  function drawTruck(ctx, w, h, cabHex, braking = false) {
    const hw = w / 2, hh = h / 2;
    ctx.save();
    shadow(ctx, w, h, 0.6);

    const { r, g, b } = Utils.hexToRgb(cabHex);

    // Trailer
    const tg = ctx.createLinearGradient(-hw, 0, hw, h * 0.2);
    tg.addColorStop(0, '#4a4a55');
    tg.addColorStop(0.5, '#5c5c68');
    tg.addColorStop(1, '#3a3a45');
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.roundRect(-hw + 4, -hh * 0.1, w - 8, h * 0.62, [2, 2, 4, 4]);
    ctx.fill();
    // Trailer panels / ribbing
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 0.6;
    for (let i = 0; i < 6; i++) {
      const py = -hh * 0.08 + i * (h * 0.62 / 6);
      ctx.beginPath();
      ctx.moveTo(-hw + 6, py);
      ctx.lineTo(hw - 6, py);
      ctx.stroke();
    }
    // Trailer rear lights
    ctx.fillStyle = 'rgba(255,60,0,0.9)';
    ctx.shadowBlur = 8; ctx.shadowColor = '#ff3000';
    ctx.fillRect(-hw + 6, -hh * 0.1 + h * 0.58, 8, 5);
    ctx.fillRect(hw - 14, -hh * 0.1 + h * 0.58, 8, 5);
    ctx.shadowBlur = 0;
    // Trailer doors
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -hh * 0.1);
    ctx.lineTo(0, -hh * 0.1 + h * 0.62);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-hw + 6, -hh * 0.1 + h * 0.62 - 8);
    ctx.lineTo(hw - 6, -hh * 0.1 + h * 0.62 - 8);
    ctx.stroke();

    // Cab (sits at top)
    const cabTop = -hh;
    const cabH = h * 0.42;
    const cab = new Path2D();
    cab.moveTo(-hw + 5, cabTop + 3);
    cab.quadraticCurveTo(-hw, cabTop + 5, -hw, cabTop + 16);
    cab.lineTo(-hw, cabTop + cabH - 4);
    cab.quadraticCurveTo(-hw, cabTop + cabH, -hw + 5, cabTop + cabH);
    cab.lineTo(hw - 5, cabTop + cabH);
    cab.quadraticCurveTo(hw, cabTop + cabH, hw, cabTop + cabH - 4);
    cab.lineTo(hw, cabTop + 16);
    cab.quadraticCurveTo(hw, cabTop + 5, hw - 5, cabTop + 3);
    cab.lineTo(hw - 14, cabTop);
    cab.quadraticCurveTo(0, cabTop - 1, -hw + 14, cabTop);
    cab.closePath();

    const cbg = ctx.createLinearGradient(-hw, cabTop, hw * 0.6, cabTop + cabH);
    cbg.addColorStop(0,   `rgb(${Math.min(r+60,255)},${Math.min(g+60,255)},${Math.min(b+60,255)})`);
    cbg.addColorStop(0.5, `rgb(${r},${g},${b})`);
    cbg.addColorStop(1,   `rgb(${Math.max(r-40,0)},${Math.max(g-40,0)},${Math.max(b-40,0)})`);
    ctx.fillStyle = cbg;
    ctx.fill(cab);
    ctx.strokeStyle = `rgba(${Math.min(r+70,255)},${Math.min(g+70,255)},${Math.min(b+70,255)},0.45)`;
    ctx.lineWidth = 0.8;
    ctx.stroke(cab);

    // Cab roof
    ctx.fillStyle = '#0d0d18';
    ctx.beginPath();
    ctx.roundRect(-hw + 12, cabTop + 12, w - 24, cabH * 0.58, 5);
    ctx.fill();

    // Windshield
    const ws = new Path2D();
    ws.moveTo(-hw + 14, cabTop + cabH * 0.58);
    ws.lineTo(-hw + 16, cabTop + 13);
    ws.lineTo(-hw + 20, cabTop + 8);
    ws.quadraticCurveTo(0, cabTop + 4, hw - 20, cabTop + 8);
    ws.lineTo(hw - 16, cabTop + 13);
    ws.lineTo(hw - 14, cabTop + cabH * 0.58);
    ws.closePath();
    glassPanel(ctx, ws, true);

    // Headlights
    headlight(ctx, -hw + 10, cabTop + 8, 10, 5);
    headlight(ctx, hw - 10, cabTop + 8, 10, 5);
    // Cab marker lights
    ctx.fillStyle = '#ffaa00';
    ctx.shadowBlur = 5; ctx.shadowColor = '#ffaa00';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(-hw + 18 + i * 10, cabTop + 2, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    taillight(ctx, -hw + 10, cabTop + cabH - 4, 7, 3, true);
    taillight(ctx, hw - 10, cabTop + cabH - 4, 7, 3, braking);

    // Big dual rear wheels
    const ty = hh - 22;
    wheel(ctx, -hw + 8, cabTop + 36, 13);
    wheel(ctx, hw - 8, cabTop + 36, 13);
    // Dual rear
    wheel(ctx, -hw + 8, ty - 7, 13);
    wheel(ctx, -hw + 8, ty + 7, 13);
    wheel(ctx, hw - 8, ty - 7, 13);
    wheel(ctx, hw - 8, ty + 7, 13);

    ctx.restore();
  }

  // ── DISPATCH FUNCTION ──────────────────────

  function draw(ctx, type, x, y, bodyHex, options = {}) {
    ctx.save();
    ctx.translate(x, y);
    const { driftAngle = 0, braking = false, isPlayer = false } = options;

    switch(type) {
      case 'sports':   drawSportsCoupe(ctx, 52, 100, bodyHex, isPlayer, driftAngle, braking); break;
      case 'sedan':    drawSedan(ctx, 48, 92, bodyHex, braking); break;
      case 'suv':      drawSUV(ctx, 54, 96, bodyHex, braking); break;
      case 'hatchback':drawHatchback(ctx, 44, 82, bodyHex, braking); break;
      case 'pickup':   drawPickup(ctx, 52, 104, bodyHex, braking); break;
      case 'truck':    drawTruck(ctx, 60, 140, bodyHex, braking); break;
    }
    ctx.restore();
  }

  // Vehicle dimensions lookup
  const DIMS = {
    sports:    { w: 52, h: 100 },
    sedan:     { w: 48, h: 92 },
    suv:       { w: 54, h: 96 },
    hatchback: { w: 44, h: 82 },
    pickup:    { w: 52, h: 104 },
    truck:     { w: 60, h: 140 },
  };

  return { draw, DIMS };
})();


// ── js/audio.js ──
// ═══════════════════════════════════════════
// audio.js — Web Audio engine
// Layered oscillators for V8 / inline-6 tone
// ═══════════════════════════════════════════

const Audio = (() => {
  let ctx = null;
  let masterGain, engineGain;
  let osc1, osc2, osc3, oscSub;
  let distNode, filterNode, filterHigh;
  let enabled = true;
  let started = false;

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();

      masterGain = ctx.createGain();
      masterGain.gain.value = enabled ? 1 : 0;
      masterGain.connect(ctx.destination);

      engineGain = ctx.createGain();
      engineGain.gain.value = 0;

      // Distortion curve — warm tube overdrive feel
      distNode = ctx.createWaveShaper();
      const N = 512, curve = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        const x = (i * 2) / N - 1;
        curve[i] = (Math.PI + 180) * x / (Math.PI + 180 * Math.abs(x));
      }
      distNode.curve = curve;

      // Low-pass — remove harshness
      filterNode = ctx.createBiquadFilter();
      filterNode.type = 'lowpass';
      filterNode.frequency.value = 650;
      filterNode.Q.value = 1.2;

      // High-pass — remove very low rumble
      filterHigh = ctx.createBiquadFilter();
      filterHigh.type = 'highpass';
      filterHigh.frequency.value = 40;

      // Sub bass (inertia / V8 low rumble)
      oscSub = ctx.createOscillator();
      oscSub.type = 'sine';
      oscSub.frequency.value = 38;
      const subG = ctx.createGain(); subG.gain.value = 0.55;

      // Mid tone (main exhaust note)
      osc1 = ctx.createOscillator();
      osc1.type = 'sawtooth';
      osc1.frequency.value = 72;
      const g1 = ctx.createGain(); g1.gain.value = 0.45;

      // Upper harmonic (intake whine)
      osc2 = ctx.createOscillator();
      osc2.type = 'square';
      osc2.frequency.value = 144;
      const g2 = ctx.createGain(); g2.gain.value = 0.18;

      // Roughness / character
      osc3 = ctx.createOscillator();
      osc3.type = 'sawtooth';
      osc3.frequency.value = 108;
      const g3 = ctx.createGain(); g3.gain.value = 0.12;

      oscSub.connect(subG);
      osc1.connect(g1);
      osc2.connect(g2);
      osc3.connect(g3);

      subG.connect(filterHigh);
      g1.connect(distNode);
      g2.connect(distNode);
      g3.connect(distNode);
      distNode.connect(filterNode);
      filterNode.connect(engineGain);
      filterHigh.connect(engineGain);
      engineGain.connect(masterGain);

      oscSub.start(); osc1.start(); osc2.start(); osc3.start();
    } catch(e) {
      console.warn('Audio init failed:', e);
    }
  }

  function resume() {
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  function setEnabled(val) {
    enabled = val;
    if (masterGain) masterGain.gain.setTargetAtTime(val ? 1 : 0, ctx.currentTime, 0.1);
  }

  // Call every frame with current speed (0-1 normalised) and nitro bool
  function updateEngine(speedNorm, nitroOn) {
    if (!ctx || !osc1) return;
    const now = ctx.currentTime;

    // RPM model: idle at 700rpm equiv, max ~8000
    const idleFreq = 38;
    const maxFreq  = nitroOn ? 280 : 210;
    const freq = idleFreq + Utils.easeIn(speedNorm) * (maxFreq - idleFreq);

    osc1.frequency.setTargetAtTime(freq, now, 0.06);
    osc2.frequency.setTargetAtTime(freq * 2.0, now, 0.06);
    osc3.frequency.setTargetAtTime(freq * 1.5, now, 0.06);
    oscSub.frequency.setTargetAtTime(freq * 0.5, now, 0.08);

    // Volume ramps with speed
    const vol = 0.06 + speedNorm * 0.22 + (nitroOn ? 0.08 : 0);
    engineGain.gain.setTargetAtTime(vol, now, 0.08);

    // Filter opens up at high rpm (intake roar)
    filterNode.frequency.setTargetAtTime(400 + speedNorm * 1800, now, 0.1);
  }

  function playOneShot(freq, type, duration, gainVal, pitchEnd) {
    if (!ctx || !enabled) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = gainVal;
    o.connect(g); g.connect(masterGain);
    o.start();
    if (pitchEnd) o.frequency.exponentialRampToValueAtTime(pitchEnd, ctx.currentTime + duration);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    o.stop(ctx.currentTime + duration + 0.01);
  }

  function playCollision() {
    if (!ctx || !enabled) return;
    playOneShot(110, 'square', 0.4, 0.5, 28);
    playOneShot(60,  'sawtooth', 0.3, 0.3, 20);
    // Metal scrape noise burst
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const flt = ctx.createBiquadFilter();
    flt.type = 'bandpass'; flt.frequency.value = 3000; flt.Q.value = 1;
    const ng = ctx.createGain(); ng.gain.value = 0.35;
    src.connect(flt); flt.connect(ng); ng.connect(masterGain);
    src.start();
  }

  function playNearMiss() {
    if (!ctx || !enabled) return;
    playOneShot(800, 'sine', 0.18, 0.12, 1200);
    playOneShot(400, 'sine', 0.22, 0.08, 200);
  }

  function playNitroStart() {
    if (!ctx || !enabled) return;
    playOneShot(180, 'sawtooth', 0.35, 0.22, 380);
  }

  function startEngine() {
    if (!ctx) init();
    resume();
    started = true;
  }

  function stopEngine() {
    if (!ctx || !engineGain) return;
    engineGain.gain.setTargetAtTime(0, ctx.currentTime, 0.4);
    started = false;
  }

  return { init, resume, startEngine, stopEngine, updateEngine, setEnabled, playCollision, playNearMiss, playNitroStart };
})();


// ── js/road.js ──
// ═══════════════════════════════════════════
// road.js — Road rendering (highway + topdown)
// ═══════════════════════════════════════════

const Road = (() => {
  // ── shared state ───────────────────────────
  let W, H;
  let offset = 0;          // scrolling offset
  let bgOffset = 0;
  let frameCount = 0;

  // ── constants ──────────────────────────────
  const LANE_COUNT = 4;
  const HORIZON_Y  = () => H * 0.40;
  const ROAD_L_TOP = () => W * 0.5 - 60;   // perspective road top-left
  const ROAD_R_TOP = () => W * 0.5 + 60;
  const ROAD_L_BOT = () => W * 0.08;
  const ROAD_R_BOT = () => W * 0.92;

  // Top-down
  const TD_ROAD_L  = () => W * 0.18;
  const TD_ROAD_R  = () => W * 0.82;
  const TD_ROAD_W  = () => TD_ROAD_R() - TD_ROAD_L();
  const TD_LANE_W  = () => TD_ROAD_W() / LANE_COUNT;

  // ── star field ─────────────────────────────
  let stars = [];
  function initStars() {
    stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random(),
        s: Math.random() * 1.6 + 0.3,
        b: Math.random(),
        sp: Math.random() * 0.003 + 0.001,
      });
    }
  }

  // ── city buildings ─────────────────────────
  let buildings = [];
  function initBuildings() {
    buildings = [];
    for (let side = 0; side < 2; side++) {
      for (let i = 0; i < 14; i++) {
        const bw = 0.035 + Math.random() * 0.045;
        buildings.push({
          side,
          x: side === 0
            ? Math.random() * 0.13 + 0.01
            : Math.random() * 0.13 + 0.86,
          bw,
          bh: 0.14 + Math.random() * 0.28,
          baseY: 0.60 + Math.random() * 0.40,
          hue: Math.random() > 0.5 ? 270 : 195,
          windows: buildWindows(bw),
        });
      }
    }
  }

  function buildWindows(bw) {
    const wins = [];
    const cols = Math.round(bw * 180);
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < cols; c++) {
        wins.push({ r, c, on: Math.random() > 0.35, phase: Math.random() * Math.PI * 2 });
      }
    }
    return wins;
  }

  // ── update ─────────────────────────────────
  function update(speed) {
    offset   = (offset + speed) % 1000;
    bgOffset = (bgOffset + speed * 0.18) % H;
    frameCount++;
    stars.forEach(s => { s.b = (Math.sin(frameCount * s.sp * 60 + s.phase) + 1) * 0.5; });
  }
  // attach phase to stars after init
  function postInitStars() { stars.forEach(s => s.phase = Math.random() * Math.PI * 2); }

  // ── sky + stars ─────────────────────────────
  function drawSky(ctx, maxY) {
    const sky = ctx.createLinearGradient(0, 0, 0, maxY);
    sky.addColorStop(0,   '#030010');
    sky.addColorStop(0.7, '#0e0024');
    sky.addColorStop(1,   '#180038');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, maxY);

    stars.forEach(s => {
      const alpha = 0.2 + s.b * 0.7;
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * maxY * 0.9, s.s * (0.5 + s.b * 0.5), 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // ── city silhouette ─────────────────────────
  function drawBuildings(ctx, maxY) {
    buildings.forEach(b => {
      const bx = b.x * W;
      const bw = b.bw * W;
      const bh = b.bh * maxY;
      const by = maxY - bh;

      // Building body
      ctx.fillStyle = '#090012';
      ctx.fillRect(bx - bw / 2, by, bw, bh);

      // Windows
      const wCols = Math.max(1, Math.round(bw / 9));
      const wRows = Math.max(1, Math.round(bh / 14));
      const wPadX = bw * 0.12, wPadY = 8;
      const wW = (bw - wPadX * 2) / wCols;
      const wH = (bh - wPadY * 2) / wRows;

      b.windows.forEach((win, idx) => {
        if (!win.on) return;
        const col = idx % wCols;
        const row = Math.floor(idx / wCols);
        if (row >= wRows) return;
        const wx = bx - bw / 2 + wPadX + col * wW + 1;
        const wy = by + wPadY + row * wH + 1;
        const ww = wW - 2, wh = wH - 2;
        if (ww < 1 || wh < 1) return;
        const flicker = Math.sin(win.phase + frameCount * 0.015) > -0.95 ? 1 : 0;
        if (!flicker) return;
        ctx.fillStyle = b.hue === 270
          ? `rgba(190,150,255,0.7)`
          : `rgba(120,220,255,0.65)`;
        ctx.shadowBlur = 3; ctx.shadowColor = b.hue === 270 ? '#a855f7' : '#38bdf8';
        ctx.fillRect(wx, wy, ww, wh);
      });
      ctx.shadowBlur = 0;

      // Rooftop accent
      ctx.strokeStyle = `hsla(${b.hue},70%,60%,0.4)`;
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 5; ctx.shadowColor = `hsla(${b.hue},70%,60%,1)`;
      ctx.beginPath();
      ctx.moveTo(bx - bw / 2, by);
      ctx.lineTo(bx + bw / 2, by);
      ctx.stroke();
      ctx.shadowBlur = 0;
    });
  }

  // ═══════════════════════════════════════════
  // HIGHWAY MODE
  // ═══════════════════════════════════════════

  function drawHighway(ctx, w, h, speed) {
    W = w; H = h;

    const HY = HORIZON_Y();
    const RLT = ROAD_L_TOP(), RRT = ROAD_R_TOP();
    const RLB = ROAD_L_BOT(), RRB = ROAD_R_BOT();

    drawSky(ctx, HY);
    drawBuildings(ctx, HY + 4);

    // ── Road surface ───────────────────────────
    const roadGrad = ctx.createLinearGradient(W / 2, HY, W / 2, H);
    roadGrad.addColorStop(0,   '#0c0c10');
    roadGrad.addColorStop(0.5, '#101014');
    roadGrad.addColorStop(1,   '#141418');
    ctx.fillStyle = roadGrad;
    ctx.beginPath();
    ctx.moveTo(RLT, HY); ctx.lineTo(RRT, HY);
    ctx.lineTo(RRB, H);  ctx.lineTo(RLB, H);
    ctx.closePath(); ctx.fill();

    // Road reflection / wet sheen
    const reflGrad = ctx.createLinearGradient(W/2, HY, W/2, H);
    reflGrad.addColorStop(0, 'rgba(138,43,226,0)');
    reflGrad.addColorStop(0.55, 'rgba(138,43,226,0.05)');
    reflGrad.addColorStop(1, 'rgba(0,229,255,0.07)');
    ctx.fillStyle = reflGrad;
    ctx.beginPath();
    ctx.moveTo(RLT, HY); ctx.lineTo(RRT, HY);
    ctx.lineTo(RRB, H);  ctx.lineTo(RLB, H);
    ctx.closePath(); ctx.fill();

    // ── Road edge barriers ─────────────────────
    const barrL = ctx.createLinearGradient(0, HY, 0, H);
    barrL.addColorStop(0, 'rgba(255,45,120,0)');
    barrL.addColorStop(1, 'rgba(255,45,120,0.25)');
    ctx.strokeStyle = barrL; ctx.lineWidth = 3;
    ctx.shadowBlur = 10; ctx.shadowColor = '#ff2d78';
    ctx.beginPath(); ctx.moveTo(RLT, HY); ctx.lineTo(RLB, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(RRT, HY); ctx.lineTo(RRB, H); ctx.stroke();
    ctx.shadowBlur = 0;

    // ── Lane dividers (perspective dashed lines) ──
    for (let l = 1; l < LANE_COUNT; l++) {
      const frac = l / LANE_COUNT;
      const bx = RLT + (RRT - RLT) * frac;
      const tx = RLB + (RRB - RLB) * frac;

      // Draw individual dashes
      const dashCount = 16;
      for (let d = 0; d < dashCount; d++) {
        const t0 = ((d / dashCount) + offset / 400) % 1;
        const t1 = t0 + 0.028;
        if (t1 > 1) continue;

        const x0 = bx + (tx - bx) * t0,  y0 = HY + (H - HY) * t0;
        const x1 = bx + (tx - bx) * t1,  y1 = HY + (H - HY) * t1;
        const alpha = Utils.clamp(t0 * 1.6, 0, 0.55);
        const lw    = t0 * 2.5 + 0.5;

        ctx.strokeStyle = `rgba(255,210,50,${alpha})`;
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      }
    }

    // ── Horizon glow ───────────────────────────
    const hg = ctx.createRadialGradient(W/2, HY, 0, W/2, HY, W * 0.5);
    hg.addColorStop(0, 'rgba(157,78,221,0.18)');
    hg.addColorStop(1, 'transparent');
    ctx.fillStyle = hg; ctx.fillRect(0, HY - 30, W, 60);
  }

  // ═══════════════════════════════════════════
  // TOP-DOWN MODE
  // ═══════════════════════════════════════════

  function drawTopDown(ctx, w, h, speed) {
    W = w; H = h;

    // Dark background
    ctx.fillStyle = '#080810';
    ctx.fillRect(0, 0, W, H);

    // Sidewalk / dirt strips
    const sideGradL = ctx.createLinearGradient(0, 0, TD_ROAD_L(), 0);
    sideGradL.addColorStop(0, '#04000e');
    sideGradL.addColorStop(1, '#0a0018');
    ctx.fillStyle = sideGradL;
    ctx.fillRect(0, 0, TD_ROAD_L(), H);

    const sideGradR = ctx.createLinearGradient(TD_ROAD_R(), 0, W, 0);
    sideGradR.addColorStop(0, '#0a0018');
    sideGradR.addColorStop(1, '#04000e');
    ctx.fillStyle = sideGradR;
    ctx.fillRect(TD_ROAD_R(), 0, W - TD_ROAD_R(), H);

    // Stars in side strips
    stars.forEach(s => {
      const alpha = 0.1 + s.b * 0.4;
      const sx = s.x < 0.5
        ? s.x * TD_ROAD_L() * 1.8
        : TD_ROAD_R() + (s.x - 0.5) * (W - TD_ROAD_R()) * 1.8;
      const sy = (s.y * H + bgOffset) % H;
      ctx.fillStyle = `rgba(200,180,255,${alpha})`;
      ctx.beginPath(); ctx.arc(sx, sy, s.s * 0.8, 0, Math.PI * 2); ctx.fill();
    });

    // Road asphalt
    const asphalt = ctx.createLinearGradient(TD_ROAD_L(), 0, TD_ROAD_R(), 0);
    asphalt.addColorStop(0,   '#0f0f14');
    asphalt.addColorStop(0.5, '#121216');
    asphalt.addColorStop(1,   '#0f0f14');
    ctx.fillStyle = asphalt;
    ctx.fillRect(TD_ROAD_L(), 0, TD_ROAD_W(), H);

    // Subtle asphalt grain
    ctx.strokeStyle = 'rgba(255,255,255,0.014)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      const x = TD_ROAD_L() + TD_ROAD_W() * (i / 6);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }

    // Centre reflection strip
    const cx = (TD_ROAD_L() + TD_ROAD_R()) / 2;
    const cg = ctx.createLinearGradient(cx - 8, 0, cx + 8, 0);
    cg.addColorStop(0, 'transparent');
    cg.addColorStop(0.5, 'rgba(138,43,226,0.07)');
    cg.addColorStop(1, 'transparent');
    ctx.fillStyle = cg; ctx.fillRect(cx - 8, 0, 16, H);

    // Road edge neon
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#ff2d78';
    ctx.shadowBlur = 14; ctx.shadowColor = '#ff2d78';
    ctx.beginPath(); ctx.moveTo(TD_ROAD_L(), 0); ctx.lineTo(TD_ROAD_L(), H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(TD_ROAD_R(), 0); ctx.lineTo(TD_ROAD_R(), H); ctx.stroke();
    ctx.shadowBlur = 0;

    // Lane dividers
    const dashLen = 44, dashGap = 22;
    const total = dashLen + dashGap;
    const off = offset % total;
    ctx.strokeStyle = 'rgba(255,200,40,0.4)';
    ctx.lineWidth = 1.8;
    ctx.setLineDash([dashLen, dashGap]);
    ctx.lineDashOffset = -off;
    for (let l = 1; l < LANE_COUNT; l++) {
      const lx = TD_ROAD_L() + l * TD_LANE_W();
      ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, H); ctx.stroke();
    }
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
  }

  // ── Public helpers for traffic to use ───────

  function getLaneX_topdown(lane) {
    return TD_ROAD_L() + (lane + 0.5) * TD_LANE_W();
  }

  // Convert a traffic vehicle's "normalised" lane/y to screen coords (highway)
  function highwayCarPos(lane, normY) {
    const frac = (lane + 0.5) / LANE_COUNT;
    const RLT = ROAD_L_TOP(), RRT = ROAD_R_TOP();
    const RLB = ROAD_L_BOT(), RRB = ROAD_R_BOT();
    const HY  = HORIZON_Y();

    const bx = RLT + (RRT - RLT) * frac;
    const tx = RLB + (RRB - RLB) * frac;
    const x  = bx + (tx - bx) * normY;
    const y  = HY + (H - HY) * normY;
    const scale = 0.18 + normY * 0.9;
    return { x, y, scale };
  }

  function getHorizonY()   { return HORIZON_Y(); }
  function getLaneCount()  { return LANE_COUNT; }
  function getTdLaneX(l)   { return getLaneX_topdown(l); }
  function getTdRoadL()    { return TD_ROAD_L(); }
  function getTdRoadR()    { return TD_ROAD_R(); }

  return {
    update,
    drawHighway, drawTopDown,
    initStars, postInitStars, initBuildings,
    getHorizonY, getLaneCount,
    highwayCarPos,
    getTdLaneX, getTdRoadL, getTdRoadR,
  };
})();


// ── js/traffic.js ──
// ═══════════════════════════════════════════
// traffic.js — Traffic vehicle spawning + update
// ═══════════════════════════════════════════

const Traffic = (() => {

  const TYPES = [
    { type: 'sedan',     color: '#c0392b', w: 48, h: 92,  speedMult: 0.55 },
    { type: 'sedan',     color: '#2980b9', w: 48, h: 92,  speedMult: 0.50 },
    { type: 'sedan',     color: '#27ae60', w: 48, h: 92,  speedMult: 0.60 },
    { type: 'hatchback', color: '#e67e22', w: 44, h: 82,  speedMult: 0.65 },
    { type: 'hatchback', color: '#8e44ad', w: 44, h: 82,  speedMult: 0.70 },
    { type: 'suv',       color: '#1a252f', w: 54, h: 96,  speedMult: 0.45 },
    { type: 'suv',       color: '#2c3e50', w: 54, h: 96,  speedMult: 0.40 },
    { type: 'pickup',    color: '#6c5ce7', w: 52, h: 104, speedMult: 0.38 },
    { type: 'pickup',    color: '#00b894', w: 52, h: 104, speedMult: 0.35 },
    { type: 'truck',     color: '#636e72', w: 60, h: 140, speedMult: 0.22 },
  ];

  let vehicles = [];
  let spawnTimer = 0;
  let spawnInterval = 90; // frames between spawns, decreases with difficulty

  function reset() {
    vehicles = [];
    spawnTimer = 0;
    spawnInterval = 90;
  }

  function spawn(laneCount, gameSpeed) {
    const tdef = TYPES[Math.floor(Math.random() * TYPES.length)];
    const lane = Math.floor(Math.random() * laneCount);

    // Don't stack vehicles on same lane
    const tooClose = vehicles.some(v =>
      v.lane === lane && v.normY < 0.12
    );
    if (tooClose) return;

    vehicles.push({
      ...tdef,
      lane,
      normY: 0,         // 0 = horizon, 1 = bottom of screen
      vy:    tdef.speedMult * gameSpeed * 0.014,
      braking: Math.random() < 0.15,
    });
  }

  function update(gameSpeed, frameCount, laneCount) {
    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawn(laneCount, gameSpeed);
      // Difficulty ramp: interval shrinks to min 28
      spawnInterval = Math.max(28, 90 - Math.floor(frameCount / 180));
    }

    vehicles.forEach(v => {
      v.normY += v.vy + gameSpeed * 0.009;
    });

    // Remove off-screen
    vehicles = vehicles.filter(v => v.normY <= 1.1);
  }

  // ── Highway draw ────────────────────────────
  function drawHighway(ctx) {
    // Sort back-to-front so closer cars overlap distant
    const sorted = [...vehicles].sort((a, b) => a.normY - b.normY);
    sorted.forEach(v => {
      const pos = Road.highwayCarPos(v.lane, v.normY);
      if (pos.y < Road.getHorizonY()) return;
      ctx.save();
      ctx.translate(pos.x, pos.y);
      ctx.scale(pos.scale, pos.scale);
      Sprites.draw(ctx, v.type, 0, 0, v.color, { braking: v.braking });
      ctx.restore();
    });
  }

  // ── Top-down draw ───────────────────────────
  function drawTopDown(ctx, canvasH) {
    vehicles.forEach(v => {
      const x = Road.getTdLaneX(v.lane);
      const y = v.normY * canvasH;
      Sprites.draw(ctx, v.type, x, y, v.color, { braking: v.braking });
    });
  }

  // ── Collision check vs player ────────────────
  // Returns the vehicle that was hit, or null
  function checkCollision(playerX, playerY, playerW, playerH, camMode, canvasH) {
    for (let v of vehicles) {
      let vx, vy, vw, vh;

      if (camMode === 'highway') {
        const pos = Road.highwayCarPos(v.lane, v.normY);
        vx = pos.x; vy = pos.y;
        vw = v.w * pos.scale;
        vh = v.h * pos.scale;
      } else {
        vx = Road.getTdLaneX(v.lane);
        vy = v.normY * canvasH;
        vw = v.w; vh = v.h;
      }

      const dx = Math.abs(vx - playerX);
      const dy = Math.abs(vy - playerY);
      if (dx < (vw + playerW) * 0.40 && dy < (vh + playerH) * 0.36) {
        return v;
      }
    }
    return null;
  }

  // Near-miss: within a slightly wider margin but not colliding
  function checkNearMiss(playerX, playerY, playerW, playerH, camMode, canvasH) {
    for (let v of vehicles) {
      let vx, vy, vw, vh;
      if (camMode === 'highway') {
        const pos = Road.highwayCarPos(v.lane, v.normY);
        vx = pos.x; vy = pos.y;
        vw = v.w * pos.scale; vh = v.h * pos.scale;
      } else {
        vx = Road.getTdLaneX(v.lane);
        vy = v.normY * canvasH;
        vw = v.w; vh = v.h;
      }
      const dx = Math.abs(vx - playerX);
      const dy = Math.abs(vy - playerY);
      const isHit   = dx < (vw + playerW) * 0.40 && dy < (vh + playerH) * 0.36;
      const isClose = dx < (vw + playerW) * 0.68 && dy < (vh + playerH) * 0.58;
      if (isClose && !isHit) return v;
    }
    return null;
  }

  function removeVehicle(v) {
    vehicles = vehicles.filter(vv => vv !== v);
  }

  function getVehicles() { return vehicles; }

  return { reset, update, drawHighway, drawTopDown, checkCollision, checkNearMiss, removeVehicle, getVehicles };
})();


// ── js/player.js ──
// ═══════════════════════════════════════════
// player.js — Player car physics + rendering
// ═══════════════════════════════════════════

const Player = (() => {
  const CAR_W = 52;
  const CAR_H = 100;

  let x, y;
  let velX = 0;
  let driftAngle = 0;
  let invincibleFrames = 0;

  let smoke = [];
  let sparks = [];

  let steerLeft  = false;
  let steerRight = false;

  const STEER_SPEED   = 7.5;
  const STEER_RETURN  = 0.72;
  const MAX_VEL       = 11;
  const DRIFT_FACTOR  = 0.018;

  function reset(canvasW, canvasH, camMode) {
    x = canvasW / 2;
    y = getDefaultY(canvasH, camMode);
    velX = 0;
    driftAngle = 0;
    invincibleFrames = 0;
    smoke = [];
    sparks = [];
  }

  function getDefaultY(H, camMode) {
    return camMode === 'topdown' ? H * 0.78 : H * 0.82;
  }

  function setSteer(left, right) {
    steerLeft  = left;
    steerRight = right;
  }

  function update(canvasW, canvasH, camMode, speed) {
    // Horizontal steering
    if (steerLeft)       velX -= STEER_SPEED;
    else if (steerRight) velX += STEER_SPEED;
    else                 velX *= STEER_RETURN;

    velX = Utils.clamp(velX, -MAX_VEL, MAX_VEL);
    x += velX;

    // Drift angle (visual lean into turn)
    driftAngle = Utils.lerp(driftAngle, velX * DRIFT_FACTOR, 0.14);

    // Clamp to road bounds
    const roadL = camMode === 'topdown'
      ? Road.getTdRoadL() + CAR_W / 2 + 4
      : canvasW * 0.10 + CAR_W / 2;
    const roadR = camMode === 'topdown'
      ? Road.getTdRoadR() - CAR_W / 2 - 4
      : canvasW * 0.90 - CAR_W / 2;

    const wasAtEdge = x <= roadL || x >= roadR;
    x = Utils.clamp(x, roadL, roadR);
    if (wasAtEdge) velX *= -0.2;

    // Y position
    y = getDefaultY(canvasH, camMode);

    // Invincibility countdown
    if (invincibleFrames > 0) invincibleFrames--;

    // Tyre smoke when steering hard or at speed
    if (Math.abs(velX) > 4 && speed > 4) {
      spawnSmoke();
    }

    // Update particles
    smoke  = smoke.filter(p => p.life > 0);
    sparks = sparks.filter(p => p.life > 0);
    smoke.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.r  += 0.6;
      p.life -= 0.024;
    });
    sparks.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.15;
      p.life -= 0.04;
    });
  }

  function spawnSmoke() {
    const sx = x + (Math.random() - 0.5) * 22;
    const sy = y + CAR_H * 0.38;
    smoke.push({
      x: sx, y: sy,
      vx: (Math.random() - 0.5) * 1.2,
      vy: Math.random() * 1.0 + 0.3,
      r: 5 + Math.random() * 4,
      life: 1,
    });
  }

  function spawnCollisionSparks() {
    for (let i = 0; i < 22; i++) {
      const a = (Math.random() * Math.PI * 2);
      const spd = 2 + Math.random() * 8;
      sparks.push({
        x: x + (Math.random() - 0.5) * 30,
        y: y + (Math.random() - 0.5) * 40,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd - 2,
        r: 2 + Math.random() * 2,
        life: 1,
        color: Math.random() > 0.5 ? '#fbbf24' : '#ff4444',
      });
    }
  }

  function spawnNearMissSparks(vx2, vy2) {
    for (let i = 0; i < 8; i++) {
      sparks.push({
        x: x + (Math.random() - 0.5) * 40,
        y: y + (Math.random() - 0.5) * 20,
        vx: (Math.random() - 0.5) * 5,
        vy: -Math.random() * 4,
        r: 2,
        life: 1,
        color: '#fbbf24',
      });
    }
  }

  function makeInvincible(frames = 100) {
    invincibleFrames = frames;
  }

  function isInvincible() { return invincibleFrames > 0; }

  // ── Drawing ─────────────────────────────────

  function draw(ctx, camMode) {
    // Smoke behind car
    smoke.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.life * 0.55;
      const sg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      sg.addColorStop(0, 'rgba(200,200,220,0.7)');
      sg.addColorStop(1, 'transparent');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    // Player car — blink when invincible
    const blink = invincibleFrames > 0 && Math.floor(invincibleFrames / 5) % 2 === 0;
    if (!blink) {
      Sprites.draw(ctx, 'sports', x, y, '#5b21b6', {
        isPlayer:   true,
        driftAngle: driftAngle,
      });
    }

    // Sparks on top
    sparks.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 6; ctx.shadowColor = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    });
  }

  // Public getters
  function getX()  { return x; }
  function getY()  { return y; }
  function getW()  { return CAR_W; }
  function getH()  { return CAR_H; }
  function getDrift() { return driftAngle; }

  return {
    reset, update, draw, setSteer,
    spawnCollisionSparks, spawnNearMissSparks, makeInvincible, isInvincible,
    getX, getY, getW, getH, getDrift,
  };
})();


// ── js/game.js ──
// ═══════════════════════════════════════════
// game.js — Main game loop & state machine
// ═══════════════════════════════════════════

const Game = (() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx    = canvas.getContext('2d');

  let W, H;
  let raf = null;
  let lastTime = 0;

  // ── Game state ──────────────────────────────
  let state      = 'menu';   // menu | playing | paused | gameover
  let camMode    = 'highway';
  let paused     = false;

  let frameCount = 0;
  let distance   = 0;
  let score      = 0;
  let speed      = 0;        // base scroll speed (px/frame equiv)
  let baseSpeed  = 3.2;
  const MAX_SPEED = 18;

  let nearMissTimer    = 0;  // frames since last near miss popup
  let nearMissCount    = 0;
  let cameraShake      = 0;
  let shakeDecay       = 0.88;
  let vibrating        = false;

  // Settings (loaded from storage)
  let settings = {
    sound:     true,
    vibration: true,
    camera:    'highway',
  };

  // ── Resize ─────────────────────────────────
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  // ── Init ────────────────────────────────────
  function init() {
    resize();
    window.addEventListener('resize', resize);
    loadSettings();
    Road.initStars();
    Road.postInitStars();
    Road.initBuildings();
    setupInput();
    startLoop();
    // Render menu background immediately
    state = 'menu';
  }

  // ── Settings persistence ───────────────────
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem('dd_settings') || '{}');
      settings = { ...settings, ...s };
      camMode = settings.camera || 'highway';
    } catch(e) {}
  }

  function saveSettings() {
    settings.camera = camMode;
    localStorage.setItem('dd_settings', JSON.stringify(settings));
  }

  // ── Input ───────────────────────────────────
  let keys = {};
  function setupInput() {
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // Touch zones (left/right half)
    const tl = document.getElementById('touch-left');
    const tr = document.getElementById('touch-right');

    function pointerDown(side) {
      if (state !== 'playing') return;
      Player.setSteer(side === 'left', side === 'right');
      document.getElementById('touch-' + side).classList.add('pressing');
    }
    function pointerUp(side) {
      // Only clear if no other pointer is still down
      Player.setSteer(
        document.getElementById('touch-left').classList.contains('pressing')  && side !== 'left',
        document.getElementById('touch-right').classList.contains('pressing') && side !== 'right'
      );
      document.getElementById('touch-' + side).classList.remove('pressing');
    }

    tl.style.pointerEvents = 'all';
    tr.style.pointerEvents = 'all';

    ['touchstart','mousedown'].forEach(ev => {
      tl.addEventListener(ev, e => { e.preventDefault(); pointerDown('left'); }, { passive: false });
      tr.addEventListener(ev, e => { e.preventDefault(); pointerDown('right'); }, { passive: false });
    });
    ['touchend','mouseup'].forEach(ev => {
      tl.addEventListener(ev, () => pointerUp('left'));
      tr.addEventListener(ev, () => pointerUp('right'));
    });
  }

  // ── Start game ──────────────────────────────
  function start() {
    camMode    = settings.camera || 'highway';
    frameCount = 0;
    distance   = 0;
    score      = 0;
    speed      = baseSpeed;
    nearMissCount = 0;
    nearMissTimer = 999;
    cameraShake   = 0;
    paused        = false;
    state         = 'playing';

    Player.reset(W, H, camMode);
    Traffic.reset();

    Audio.startEngine();
    UI.showHUD(true);
    UI.hideOverlay('overlay-pause');
    UI.hideOverlay('overlay-gameover');
    UI.showScreen(null); // hide all screens
  }

  // ── Toggle pause ───────────────────────────
  function togglePause() {
    if (state === 'playing') {
      paused = true;
      state  = 'paused';
      UI.showOverlay('overlay-pause');
      Audio.stopEngine();
    } else if (state === 'paused') {
      paused = false;
      state  = 'playing';
      UI.hideOverlay('overlay-pause');
      Audio.startEngine();
    }
  }

  // ── Quit to menu ───────────────────────────
  function quit() {
    state = 'menu';
    paused = false;
    Audio.stopEngine();
    UI.showHUD(false);
    UI.hideOverlay('overlay-pause');
    UI.hideOverlay('overlay-gameover');
    UI.showScreen('screen-menu');
    UI.updateMenuBest();
    Player.setSteer(false, false);
  }

  // ── Game over ──────────────────────────────
  function endGame() {
    state = 'gameover';
    Audio.stopEngine();
    Audio.playCollision();

    // Save best
    const best = Math.max(distance, parseInt(localStorage.getItem('dd_best') || '0'));
    localStorage.setItem('dd_best', best);

    Achievements.check(distance, nearMissCount, score);

    UI.showOverlay('overlay-gameover');
    document.getElementById('goDistance').textContent = Math.round(distance) + ' m';
    document.getElementById('goScore').textContent    = score.toLocaleString();
